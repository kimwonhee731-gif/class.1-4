<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026학년도 1-4</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR",
    sans-serif;
  background: #f7f7fb;
  color: #333;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  gap: 15px;
}

.title {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -1px;
}

.header-right {
  display: flex;
  gap: 8px;
}

button {
  border: none;
  cursor: pointer;
  font-family: inherit;
}

.today-btn {
  background: white;
  border: 1px solid #e8e8ef;
  padding: 9px 15px;
  border-radius: 12px;
  font-weight: 600;
}

/* MONTH */
.month-header {
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eeeef3;
}

.month-title {
  font-size: 23px;
  font-weight: 800;
}

.month-buttons {
  display: flex;
  gap: 7px;
}

.month-buttons button {
  width: 38px;
  height: 38px;
  background: #f5f5f8;
  border-radius: 11px;
  font-size: 18px;
}

.month-buttons button:disabled {
  opacity: 0.3;
  cursor: default;
}

/* CALENDAR */
.calendar {
  background: white;
  border-radius: 0 0 22px 22px;
  overflow: hidden;
  box-shadow: 0 5px 25px rgba(30, 30, 50, 0.04);
}

.weekdays,
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.weekdays {
  background: #fafafd;
  border-bottom: 1px solid #eeeeF3;
}

.weekday {
  text-align: center;
  padding: 12px 0;
  font-size: 13px;
  font-weight: 700;
  color: #888;
}

.weekday:first-child {
  color: #ed7777;
}

.weekday:last-child {
  color: #7187d9;
}

/*
  한 주를 하나의 grid로 사용.
  일정 막대도 이 grid 안에서 여러 칸을 차지하게 만들어
  진짜 가로 막대처럼 이어지게 함.
*/
.week {
  position: relative;
  min-height: 145px;
  border-bottom: 1px solid #eeeeF3;
}

.day {
  position: relative;
  min-width: 0;
  border-right: 1px solid #eeeeF3;
  padding: 9px 7px 55px;
  cursor: pointer;
}

.day:last-child {
  border-right: none;
}

.day.empty {
  background: #fcfcfd;
  cursor: default;
}

.day-number {
  width: 27px;
  height: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  border-radius: 50%;
  position: relative;
  z-index: 5;
}

.day.today .day-number {
  background: #333;
  color: white;
}

.day.sunday .day-number {
  color: #ed7777;
}

.day.saturday .day-number {
  color: #7187d9;
}

.day.today.sunday .day-number,
.day.today.saturday .day-number {
  color: white;
}

/*
  일정 막대 영역
  grid-column으로 시작일부터 끝일까지 한 번에 차지한다.
*/
.event-layer {
  position: absolute;
  left: 0;
  right: 0;
  top: 42px;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 29px;
  pointer-events: none;
}

.event-bar {
  height: 24px;
  margin: 2px 3px;
  padding: 4px 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: pointer;
  pointer-events: auto;
  position: relative;
  z-index: 10;
  transition: transform .15s ease;
}

.event-bar:hover {
  transform: translateY(-1px);
}

/*
  주가 바뀌는 경우:
  하나의 일정이 월요일~일요일을 넘어서면
  주별로 하나씩 막대를 생성하지만,
  화면상으로는 자연스럽게 이어진 것처럼 보임.
*/

.event-bar.start {
  border-radius: 8px 8px 8px 8px;
}

.event-bar.middle {
  border-radius: 5px;
}

.event-bar.end {
  border-radius: 8px;
}

/* 색상 */
.event-pink {
  background: #ffdce5;
  color: #a94f69;
}

.event-purple {
  background: #e7ddff;
  color: #7657ad;
}

.event-blue {
  background: #dcecff;
  color: #5075ad;
}

.event-green {
  background: #dff3e5;
  color: #4e8a60;
}

.event-yellow {
  background: #fff0c7;
  color: #99752d;
}

.event-peach {
  background: #ffe3d4;
  color: #a96346;
}

/* SEARCH */
.search-area {
  margin-top: 20px;
  margin-bottom: 15px;
}

.search {
  width: 100%;
  padding: 14px 17px;
  border: 1px solid #e5e5ec;
  border-radius: 14px;
  background: white;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

.search:focus {
  border-color: #bbb;
}

/* DETAIL */
.detail-panel {
  margin-top: 22px;
  background: white;
  border-radius: 20px;
  padding: 25px;
  display: none;
  box-shadow: 0 5px 25px rgba(30,30,50,.04);
}

.detail-panel.show {
  display: block;
}

.detail-title {
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 8px;
}

.detail-date {
  color: #999;
  font-size: 13px;
  margin-bottom: 18px;
}

.detail-content {
  white-space: pre-wrap;
  line-height: 1.7;
  font-size: 14px;
}

.detail-image {
  max-width: 100%;
  max-height: 450px;
  margin-top: 18px;
  border-radius: 14px;
  display: block;
}

.detail-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.edit-btn,
.delete-btn {
  padding: 10px 15px;
  border-radius: 10px;
  font-weight: 700;
}

.edit-btn {
  background: #f1f1f6;
}

.delete-btn {
  background: #ffe7e7;
  color: #c45b5b;
}

/* MODAL */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(20,20,30,.35);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 23px;
  padding: 25px;
}

.modal-title {
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 20px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

.field input,
.field textarea {
  width: 100%;
  border: 1px solid #e4e4eb;
  border-radius: 11px;
  padding: 11px 12px;
  font-family: inherit;
  outline: none;
}

.field textarea {
  min-height: 100px;
  resize: vertical;
}

.date-row,
.time-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

/* ALL DAY */
.all-day-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
  font-size: 13px;
}

.all-day-row input {
  width: 17px;
  height: 17px;
}

/* COLOR */
.colors {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.color-option {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
}

.color-option.selected {
  border-color: #333;
}

.color-pink { background: #ffdce5; }
.color-purple { background: #e7ddff; }
.color-blue { background: #dcecff; }
.color-green { background: #dff3e5; }
.color-yellow { background: #fff0c7; }
.color-peach { background: #ffe3d4; }

/* PHOTO */
.preview {
  max-width: 100%;
  max-height: 200px;
  border-radius: 12px;
  margin-top: 10px;
  display: none;
}

/* MODAL BUTTONS */
.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 22px;
}

.cancel-btn,
.save-btn {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  font-weight: 800;
}

.cancel-btn {
  background: #f2f2f5;
}

.save-btn {
  background: #333;
  color: white;
}

/* EMPTY MESSAGE */
.no-result {
  padding: 30px;
  text-align: center;
  color: #999;
}

/* MOBILE */
@media (max-width: 700px) {

  .container {
    padding: 17px 10px 45px;
  }

  .header {
    margin-bottom: 15px;
  }

  .title {
    font-size: 22px;
  }

  .today-btn {
    padding: 8px 11px;
    font-size: 12px;
  }

  .month-header {
    padding: 15px 14px;
  }

  .month-title {
    font-size: 19px;
  }

  .month-buttons button {
    width: 34px;
    height: 34px;
  }

  .weekday {
    font-size: 11px;
    padding: 10px 0;
  }

  .week {
    min-height: 125px;
  }

  .day {
    padding: 7px 3px 45px;
  }

  .day-number {
    width: 24px;
    height: 24px;
    font-size: 11px;
  }

  .event-layer {
    top: 35px;
    grid-auto-rows: 25px;
  }

  .event-bar {
    height: 21px;
    margin: 2px 2px;
    padding: 3px 5px;
    font-size: 9px;
    border-radius: 6px;
  }

  .detail-panel {
    padding: 18px;
  }

  .modal {
    padding: 20px;
    border-radius: 18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="title">2026학년도 1-4</div>

    <div class="header-right">
      <button class="today-btn" onclick="goToday()">오늘</button>
    </div>
  </div>

  <div class="search-area">
    <input
      class="search"
      id="searchInput"
      type="text"
      placeholder="일정 검색하기"
      oninput="renderCalendar()"
    >
  </div>

  <div class="month-header">
    <div class="month-title" id="monthTitle"></div>

    <div class="month-buttons">
      <button id="prevBtn" onclick="changeMonth(-1)">‹</button>
      <button id="nextBtn" onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="calendar">

    <div class="weekdays">
      <div class="weekday">일</div>
      <div class="weekday">월</div>
      <div class="weekday">화</div>
      <div class="weekday">수</div>
      <div class="weekday">목</div>
      <div class="weekday">금</div>
      <div class="weekday">토</div>
    </div>

    <div id="calendarBody"></div>

  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-date" id="detailDate"></div>
    <div class="detail-content" id="detailContent"></div>
    <img class="detail-image" id="detailImage">

    <div class="detail-actions">
      <button class="edit-btn" onclick="editSelected()">수정</button>
      <button class="delete-btn" onclick="deleteSelected()">삭제</button>
    </div>
  </div>

</div>


<!-- MODAL -->

<div class="modal-bg" id="modalBg">

  <div class="modal">

    <div class="modal-title" id="modalTitle">일정 추가</div>

    <div class="field">
      <label>일정 이름</label>
      <input id="eventTitle" type="text" placeholder="일정 이름을 입력하세요">
    </div>

    <div class="field">
      <label>기간</label>

      <div class="date-row">
        <input id="startDate" type="date">
        <input id="endDate" type="date">
      </div>
    </div>

    <div class="all-day-row">
      <input id="allDay" type="checkbox" checked onchange="toggleTime()">
      <label for="allDay">종일 일정</label>
    </div>

    <div class="field" id="timeFields" style="display:none;">
      <label>시간</label>

      <div class="time-row">
        <input
          id="startTime"
          type="text"
          inputmode="numeric"
          maxlength="5"
          placeholder="09:00"
        >

        <input
          id="endTime"
          type="text"
          inputmode="numeric"
          maxlength="5"
          placeholder="10:00"
        >
      </div>
    </div>

    <div class="field">
      <label>색상</label>

      <div class="colors">

        <div
          class="color-option color-pink selected"
          data-color="pink"
          onclick="selectColor(this)"
        ></div>

        <div
          class="color-option color-purple"
          data-color="purple"
          onclick="selectColor(this)"
        ></div>

        <div
          class="color-option color-blue"
          data-color="blue"
          onclick="selectColor(this)"
        ></div>

        <div
          class="color-option color-green"
          data-color="green"
          onclick="selectColor(this)"
        ></div>

        <div
          class="color-option color-yellow"
          data-color="yellow"
          onclick="selectColor(this)"
        ></div>

        <div
          class="color-option color-peach"
          data-color="peach"
          onclick="selectColor(this)"
        ></div>

      </div>
    </div>

    <div class="field">
      <label>상세 내용</label>
      <textarea
        id="eventContent"
        placeholder="일정에 대한 내용을 입력하세요"
      ></textarea>
    </div>

    <div class="field">
      <label>사진</label>
      <input id="eventImage" type="file" accept="image/*" onchange="previewImage(event)">
      <img id="preview" class="preview">
    </div>

    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeModal()">취소</button>
      <button class="save-btn" onclick="saveEvent()">저장</button>
    </div>

  </div>

</div>


<script>

/* =========================================
   기본 설정
========================================= */

const MIN_DATE = new Date(2026, 8, 1);  // 2026-09-01
const MAX_DATE = new Date(2027, 1, 28); // 2027-02-28

let currentMonth = new Date(2026, 8, 1);

let events = JSON.parse(
  localStorage.getItem("class14_events") || "[]"
);

let selectedColor = "pink";
let editingId = null;
let selectedEventId = null;
let selectedImageData = "";


/* =========================================
   날짜 함수
========================================= */

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

function parseDate(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(str) {
  const d = parseDate(str);

  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

function isSameDay(a, b) {
  return dateKey(a) === dateKey(b);
}

function clampDate(date) {
  if (date < MIN_DATE) return new Date(MIN_DATE);
  if (date > MAX_DATE) return new Date(MAX_DATE);

  return date;
}


/* =========================================
   달력 이동
========================================= */

function changeMonth(amount) {

  currentMonth = new Date(
    currentMonth.getFullYear(),
    currentMonth.getMonth() + amount,
    1
  );

  if (currentMonth < MIN_DATE) {
    currentMonth = new Date(MIN_DATE);
  }

  if (
    currentMonth.getFullYear() > MAX_DATE.getFullYear() ||
    (
      currentMonth.getFullYear() === MAX_DATE.getFullYear() &&
      currentMonth.getMonth() > MAX_DATE.getMonth()
    )
  ) {
    currentMonth = new Date(
      MAX_DATE.getFullYear(),
      MAX_DATE.getMonth(),
      1
    );
  }

  renderCalendar();
}

function goToday() {

  const today = new Date();

  if (
    today >= MIN_DATE &&
    today <= MAX_DATE
  ) {
    currentMonth = new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );
  }

  renderCalendar();
}


/* =========================================
   달력 그리기
========================================= */

function renderCalendar() {

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  document.getElementById("monthTitle").textContent =
    `${year}년 ${month + 1}월`;

  const body = document.getElementById("calendarBody");

  body.innerHTML = "";

  const firstDay = new Date(year, month, 1).getDay();

  const lastDate = new Date(year, month + 1, 0).getDate();

  const totalCells =
    Math.ceil((firstDay + lastDate) / 7) * 7;

  const search =
    document.getElementById("searchInput").value
      .trim()
      .toLowerCase();

  const today = new Date();


  /* 주 단위로 생성 */

  for (
    let weekStart = 0;
    weekStart < totalCells;
    weekStart += 7
  ) {

    const week = document.createElement("div");

    week.className = "week";

    /*
      날짜 칸
    */

    for (let i = 0; i < 7; i++) {

      const cellIndex = weekStart + i;

      const dayNumber =
        cellIndex - firstDay + 1;

      const day = document.createElement("div");

      day.className = "day";

      if (
        dayNumber < 1 ||
        dayNumber > lastDate
      ) {

        day.classList.add("empty");

        week.appendChild(day);

        continue;
      }

      const date = new Date(
        year,
        month,
        dayNumber
      );

      const key = dateKey(date);

      if (i === 0) {
        day.classList.add("sunday");
      }

      if (i === 6) {
        day.classList.add("saturday");
      }

      if (isSameDay(date, today)) {
        day.classList.add("today");
      }

      day.onclick = function(e) {

        if (
          e.target.classList.contains("event-bar")
        ) return;

        openModal(key);
      };


      const number = document.createElement("div");

      number.className = "day-number";

      number.textContent = dayNumber;

      day.appendChild(number);

      week.appendChild(day);
    }


    /*
      ⭐ 핵심 ⭐

      이 주에 포함되는 일정들을 찾은 뒤

      일정 하나당 event-bar 하나만 만들고

      grid-column을 이용해서
      시작일부터 끝일까지 가로로 늘림.
    */

    const weekStartDate = new Date(
      year,
      month,
      1 - firstDay + weekStart
    );

    const weekEndDate = new Date(
      weekStartDate.getFullYear(),
      weekStartDate.getMonth(),
      weekStartDate.getDate() + 6
    );


    const weekEvents = events.filter(event => {

      const start = parseDate(event.start);
      const end = parseDate(event.end);

      return (
        start <= weekEndDate &&
        end >= weekStartDate &&
        (
          !search ||
          event.title.toLowerCase().includes(search) ||
          (event.content || "").toLowerCase().includes(search)
        )
      );

    });


    /*
      일정끼리 겹칠 경우
      서로 다른 줄에 표시
    */

    const lanes = [];


    weekEvents.sort((a, b) =>
      a.start.localeCompare(b.start)
    );


    weekEvents.forEach(event => {

      const eventStart = parseDate(event.start);
      const eventEnd = parseDate(event.end);

      const visibleStart =
        eventStart < weekStartDate
          ? weekStartDate
          : eventStart;

      const visibleEnd =
        eventEnd > weekEndDate
          ? weekEndDate
          : eventEnd;


      let lane = 0;

      while (true) {

        if (!lanes[lane]) {
          lanes[lane] = [];
          break;
        }

        const conflict =
          lanes[lane].some(other => {

            return !(
              visibleEnd < other.start ||
              visibleStart > other.end
            );

          });

        if (!conflict) break;

        lane++;
      }


      lanes[lane].push({
        start: visibleStart,
        end: visibleEnd
      });


      /*
        grid 위치 계산

        일요일 = 1
        월요일 = 2
        ...
        토요일 = 7
      */

      let startColumn =
        visibleStart.getDay() + 1;

      let endColumn =
        visibleEnd.getDay() + 2;


      /*
        실제 월 밖 날짜에 걸치는 경우 보정
      */

      if (visibleStart < weekStartDate) {
        startColumn = 1;
      }

      if (visibleEnd > weekEndDate) {
        endColumn = 8;
      }


      const bar =
        document.createElement("div");

      bar.className =
        `event-bar event-${event.color}`;


      /*
        ⭐ 일정 이름은 "진짜 시작 날짜"에서만 표시

        예:
        14~22 일정이면

        14일 → 시험기간
        15~22일 → 빈 막대

        다음 주로 넘어가도
        일정 이름을 다시 쓰지 않음.
      */

      const isRealStart =
        isSameDay(visibleStart, eventStart);

      const isRealEnd =
        isSameDay(visibleEnd, eventEnd);


      if (isRealStart) {
        bar.textContent = event.title;
      } else {
        bar.textContent = "";
      }


      if (isRealStart) {
        bar.classList.add("start");
      }

      if (isRealEnd) {
        bar.classList.add("end");
      }

      if (!isRealStart && !isRealEnd) {
        bar.classList.add("middle");
      }


      bar.style.gridColumn =
        `${startColumn} / ${endColumn}`;

      bar.style.gridRow =
        `${lane + 1}`;


      bar.onclick = function(e) {

        e.stopPropagation();

        showDetail(event.id);
      };


      /*
        event-layer가 아직 없으면 생성
      */

      let layer =
        week.querySelector(".event-layer");

      if (!layer) {

        layer =
          document.createElement("div");

        layer.className = "event-layer";

        week.appendChild(layer);
      }

      layer.appendChild(bar);

    });


    body.appendChild(week);
  }


  updateMonthButtons();
}


/* =========================================
   이전/다음 버튼 활성화
========================================= */

function updateMonthButtons() {

  const prev =
    document.getElementById("prevBtn");

  const next =
    document.getElementById("nextBtn");


  prev.disabled =
    currentMonth.getFullYear() === MIN_DATE.getFullYear() &&
    currentMonth.getMonth() === MIN_DATE.getMonth();


  next.disabled =
    currentMonth.getFullYear() === MAX_DATE.getFullYear() &&
    currentMonth.getMonth() === MAX_DATE.getMonth();
}


/* =========================================
   모달 열기
========================================= */

function openModal(date) {

  editingId = null;

  selectedImageData = "";

  document.getElementById("modalTitle").textContent =
    "일정 추가";

  document.getElementById("eventTitle").value = "";

  document.getElementById("startDate").value = date;

  document.getElementById("endDate").value = date;

  document.getElementById("allDay").checked = true;

  document.getElementById("startTime").value = "";

  document.getElementById("endTime").value = "";

  document.getElementById("eventContent").value = "";

  document.getElementById("eventImage").value = "";

  document.getElementById("preview").style.display = "none";

  selectedColor = "pink";

  document.querySelectorAll(".color-option")
    .forEach(x => x.classList.remove("selected"));

  document
    .querySelector('[data-color="pink"]')
    .classList.add("selected");

  toggleTime();

  document
    .getElementById("modalBg")
    .classList.add("show");
}


/* =========================================
   수정 모달
========================================= */

function editSelected() {

  const event =
    events.find(e => e.id === selectedEventId);

  if (!event) return;

  editingId = event.id;

  document.getElementById("modalTitle").textContent =
    "일정 수정";

  document.getElementById("eventTitle").value =
    event.title;

  document.getElementById("startDate").value =
    event.start;

  document.getElementById("endDate").value =
    event.end;

  document.getElementById("allDay").checked =
    event.allDay;

  document.getElementById("startTime").value =
    event.startTime || "";

  document.getElementById("endTime").value =
    event.endTime || "";

  document.getElementById("eventContent").value =
    event.content || "";

  selectedColor =
    event.color || "pink";

  document.querySelectorAll(".color-option")
    .forEach(x => x.classList.remove("selected"));

  document
    .querySelector(`[data-color="${selectedColor}"]`)
    .classList.add("selected");


  selectedImageData =
    event.image || "";


  const preview =
    document.getElementById("preview");

  if (selectedImageData) {

    preview.src = selectedImageData;

    preview.style.display = "block";

  } else {

    preview.style.display = "none";

  }


  toggleTime();

  document
    .getElementById("modalBg")
    .classList.add("show");
}


/* =========================================
   시간 표시
========================================= */

function toggleTime() {

  const allDay =
    document.getElementById("allDay").checked;

  document.getElementById("timeFields").style.display =
    allDay ? "none" : "block";
}


/* =========================================
   색상 선택
========================================= */

function selectColor(el) {

  document.querySelectorAll(".color-option")
    .forEach(x => x.classList.remove("selected"));

  el.classList.add("selected");

  selectedColor =
    el.dataset.color;
}


/* =========================================
   시간 자동 변환
========================================= */

function formatTimeInput(input) {

  let value =
    input.value.replace(/\D/g, "");

  if (value.length > 4) {
    value = value.slice(0, 4);
  }

  if (value.length >= 3) {

    value =
      value.slice(0, 2) +
      ":" +
      value.slice(2);

  }

  input.value = value;
}

document
  .getElementById("startTime")
  .addEventListener("input", function() {

    formatTimeInput(this);

  });

document
  .getElementById("endTime")
  .addEventListener("input", function() {

    formatTimeInput(this);

  });


/* =========================================
   이미지
========================================= */

function previewImage(e) {

  const file =
    e.target.files[0];

  if (!file) return;


  const reader =
    new FileReader();

  reader.onload = function() {

    selectedImageData =
      reader.result;

    const preview =
      document.getElementById("preview");

    preview.src =
      selectedImageData;

    preview.style.display =
      "block";
  };

  reader.readAsDataURL(file);
}


/* =========================================
   이미지 압축
========================================= */

function compressImage(dataUrl) {

  return new Promise(resolve => {

    if (!dataUrl) {
      resolve("");
      return;
    }

    const img =
      new Image();

    img.onload = function() {

      const maxWidth = 1000;

      let width =
        img.width;

      let height =
        img.height;


      if (width > maxWidth) {

        height =
          height * maxWidth / width;

        width =
          maxWidth;
      }


      const canvas =
        document.createElement("canvas");

      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      resolve(
        canvas.toDataURL(
          "image/jpeg",
          0.75
        )
      );
    };

    img.src =
      dataUrl;
  });
}


/* =========================================
   일정 저장
========================================= */

async function saveEvent() {

  const title =
    document.getElementById("eventTitle")
      .value.trim();

  const start =
    document.getElementById("startDate").value;

  const end =
    document.getElementById("endDate").value;

  const allDay =
    document.getElementById("allDay").checked;

  const startTime =
    document.getElementById("startTime").value;

  const endTime =
    document.getElementById("endTime").value;

  const content =
    document.getElementById("eventContent").value;

  if (!title) {
    alert("일정 이름을 입력해주세요.");
    return;
  }

  if (!start || !end) {
    alert("날짜를 선택해주세요.");
    return;
  }

  if (parseDate(start) > parseDate(end)) {
    alert("종료일은 시작일보다 빠를 수 없습니다.");
    return;
  }


  /*
    사진이 새로 선택된 경우 압축
  */

  let image =
    selectedImageData;

  if (
    image &&
    image.startsWith("data:image")
  ) {
    image =
      await compressImage(image);
  }


  if (editingId) {

    const index =
      events.findIndex(
        e => e.id === editingId
      );

    if (index !== -1) {

      events[index] = {

        ...events[index],

        title,
        start,
        end,
        allDay,
        startTime,
        endTime,
        color: selectedColor,
        content,
        image
      };
    }

  } else {

    events.push({

      id:
        Date.now().toString(),

      title,
      start,
      end,
      allDay,
      startTime,
      endTime,
      color: selectedColor,
      content,
      image
    });
  }


  localStorage.setItem(
    "class14_events",
    JSON.stringify(events)
  );


  closeModal();

  renderCalendar();

  if (editingId) {
    showDetail(editingId);
  }
}


/* =========================================
   상세 보기
========================================= */

function showDetail(id) {

  const event =
    events.find(e => e.id === id);

  if (!event) return;

  selectedEventId =
    id;


  document.getElementById("detailTitle")
    .textContent =
      event.title;


  let dateText =
    `${formatDate(event.start)} ~ ${formatDate(event.end)}`;


  if (!event.allDay && event.startTime) {

    dateText +=
      ` · ${event.startTime} ~ ${event.endTime}`;
  }


  document.getElementById("detailDate")
    .textContent =
      dateText;


  document.getElementById("detailContent")
    .textContent =
      event.content || "등록된 상세 내용이 없습니다.";


  const image =
    document.getElementById("detailImage");


  if (event.image) {

    image.src =
      event.image;

    image.style.display =
      "block";

  } else {

    image.style.display =
      "none";
  }


  document.getElementById("detailPanel")
    .classList.add("show");


  document.getElementById("detailPanel")
    .scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
}


/* =========================================
   일정 삭제
========================================= */

function deleteSelected() {

  const event =
    events.find(e => e.id === selectedEventId);

  if (!event) return;


  const ok =
    confirm(
      `"${event.title}" 일정을 삭제할까요?`
    );

  if (!ok) return;


  events =
    events.filter(
      e => e.id !== selectedEventId
    );


  localStorage.setItem(
    "class14_events",
    JSON.stringify(events)
  );


  selectedEventId =
    null;


  document.getElementById("detailPanel")
    .classList.remove("show");


  renderCalendar();
}


/* =========================================
   모달 닫기
========================================= */

function closeModal() {

  document
    .getElementById("modalBg")
    .classList.remove("show");

  editingId = null;

  selectedImageData = "";
}


/* =========================================
   ESC로 모달 닫기
========================================= */

document.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Escape") {
      closeModal();
    }

  }
);


/* =========================================
   시작
========================================= */

renderCalendar();

</script>
