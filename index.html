<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리반</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f5f6f8;
    color:#222;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,textarea{font-family:inherit}
button{cursor:pointer}

.app{
    max-width:650px;
    min-height:100vh;
    margin:auto
}

header{padding:28px 22px 18px}

.back{
    border:0;
    background:none;
    padding:0;
    margin-bottom:20px;
    color:#666;
    font-size:16px
}

h1{margin:0;font-size:30px}

.subtitle{
    margin-top:8px;
    color:#888;
    font-size:14px
}

.page{display:none}
.page.active{display:block}

.menu{
    padding:10px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:14px
}

.menu-button{
    width:100%;
    padding:22px;
    border:0;
    border-radius:18px;
    background:white;
    text-align:left;
    font-size:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.06)
}

.menu-button span{
    display:block;
    margin-top:7px;
    color:#888;
    font-size:13px
}

.content{padding:5px 20px 40px}

.card,.schedule-item,.link-card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:13px;
    box-shadow:0 3px 10px rgba(0,0,0,.05)
}

.card h3{margin:0 0 8px}
.card p{line-height:1.5;color:#555}

.date{
    font-size:12px;
    color:#999;
    margin-bottom:6px
}

.add-button,.submit{
    width:100%;
    border:0;
    border-radius:12px;
    background:#222;
    color:white;
    padding:15px;
    font-size:15px
}

.form-box{
    display:none;
    background:white;
    padding:18px;
    border-radius:15px;
    margin-bottom:15px
}

.form-box.show{display:block}

input,textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    margin-bottom:10px;
    outline:none
}

textarea{
    min-height:110px;
    resize:vertical
}

.delete{
    margin-top:12px;
    border:0;
    background:#f0f0f0;
    color:#666;
    padding:8px 12px;
    border-radius:8px
}

/* 달력 */

.calendar{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.05)
}

.calendar-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px
}

.calendar-title h2{
    margin:0;
    font-size:18px
}

.calendar-title button{
    border:0;
    background:#f0f0f0;
    border-radius:8px;
    padding:8px 13px
}

.weekdays,.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center
}

.weekdays div{
    padding:8px 0;
    font-size:12px;
    color:#888
}

.days div{
    min-height:65px;
    padding:6px 2px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer
}

.days div:hover{background:#f1f1f1}

.day-number{margin-bottom:4px}

.event{
    background:#eee;
    border-radius:5px;
    padding:3px;
    margin-top:3px;
    font-size:10px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis
}

.empty{
    text-align:center;
    color:#999;
    padding:35px 10px
}

.link-card{
    display:block;
    text-decoration:none;
    color:#222
}

.link-card small{
    display:block;
    color:#888;
    margin-top:5px
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<section id="home" class="page active">

<header>
<h1>우리반</h1>
<div class="subtitle">1학년 4반 전용 공간</div>
</header>

<div class="menu">

<button class="menu-button" onclick="showPage('notice')">
📢 공지사항
<span>우리반의 중요한 소식을 확인해요</span>
</button>

<button class="menu-button" onclick="showPage('suggestion')">
📝 익명 건의함
<span>이름 없이 자유롭게 의견을 남겨요</span>
</button>

<button class="menu-button" onclick="showPage('calendar')">
📅 우리반 일정
<span>날짜를 눌러 일정을 추가해요</span>
</button>

<button class="menu-button" onclick="showPage('assignment')">
🔗 과제 제출 링크
<span>과제 제출 링크를 한곳에서 확인해요</span>
</button>

</div>
</section>


<!-- NOTICE -->

<section id="notice" class="page">

<header>
<button class="back" onclick="showPage('home')">← 돌아가기</button>
<h1>공지사항</h1>
<div class="subtitle">우리반의 중요한 소식</div>
</header>

<div class="content">

<button class="add-button" onclick="toggleForm('noticeForm')">
＋ 공지 작성
</button>

<div id="noticeForm" class="form-box">

<input id="noticeTitle" placeholder="공지 제목">

<textarea id="noticeText"
placeholder="공지 내용을 입력해주세요"></textarea>

<button class="submit" onclick="addNotice()">
공지 올리기
</button>

</div>

<div id="noticeList"></div>

</div>
</section>


<!-- SUGGESTION -->

<section id="suggestion" class="page">

<header>
<button class="back" onclick="showPage('home')">← 돌아가기</button>
<h1>익명 건의함</h1>
<div class="subtitle">이름 없이 자유롭게 의견을 남겨주세요</div>
</header>

<div class="content">

<div class="card">

<textarea id="suggestionText"
placeholder="우리반에 바라는 점이나 건의사항을 적어주세요"></textarea>

<button class="submit" onclick="addSuggestion()">
익명으로 제출하기
</button>

</div>

<div id="suggestionList"></div>

</div>
</section>


<!-- CALENDAR -->

<section id="calendar" class="page">

<header>
<button class="back" onclick="showPage('home')">← 돌아가기</button>
<h1>우리반 일정</h1>
<div class="subtitle">날짜를 눌러 일정을 추가하세요</div>
</header>

<div class="content">

<div class="calendar">

<div class="calendar-title">

<button onclick="changeMonth(-1)">‹</button>

<h2 id="monthTitle"></h2>

<button onclick="changeMonth(1)">›</button>

</div>

<div class="weekdays">
<div>일</div>
<div>월</div>
<div>화</div>
<div>수</div>
<div>목</div>
<div>금</div>
<div>토</div>
</div>

<div id="days" class="days"></div>

</div>


<div id="eventForm" class="form-box">

<h3 id="selectedDateTitle">일정 추가</h3>

<input id="eventTitle" placeholder="일정 제목">

<textarea id="eventText"
placeholder="일정 내용을 입력해주세요"></textarea>

<button class="submit" onclick="addEvent()">
일정 등록
</button>

</div>


<h3>📌 등록된 일정</h3>

<div id="scheduleList"></div>

</div>
</section>


<!-- ASSIGNMENT -->

<section id="assignment" class="page">

<header>
<button class="back" onclick="showPage('home')">← 돌아가기</button>
<h1>과제 제출 링크</h1>
<div class="subtitle">과제 제출 링크를 한곳에서 확인해요</div>
</header>

<div class="content">

<button class="add-button"
onclick="toggleForm('assignmentForm')">
＋ 과제 링크 추가
</button>

<div id="assignmentForm" class="form-box">

<input id="assignmentTitle"
placeholder="과제 이름">

<input id="assignmentUrl"
placeholder="제출 링크 (https://...)">

<button class="submit" onclick="addAssignment()">
링크 추가
</button>

</div>

<div id="assignmentList"></div>

</div>
</section>

</div>


<!-- Firebase -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:"AIzaSyD3m1KGCNHIIiAvpxXcghnZdun9SE3y3uU",

    authDomain:"class-1-4-725d3.firebaseapp.com",

    projectId:"class-1-4-725d3",

    storageBucket:"class-1-4-725d3.firebasestorage.app",

    messagingSenderId:"327795271637",

    appId:"1:327795271637:web:ba76dfe7724fd3f8adbf5c",

    measurementId:"G-JLFBT216GK"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ================= 화면 ================= */

window.showPage = function(pageId){

document.querySelectorAll(".page")
.forEach(page => page.classList.remove("active"));

document.getElementById(pageId)
.classList.add("active");

window.scrollTo(0,0);

if(pageId === "calendar"){
renderCalendar();
}

};


/* ================= 폼 ================= */

window.toggleForm = function(id){

document.getElementById(id)
.classList.toggle("show");

};


/* ================= HTML 안전 처리 ================= */

function escapeHtml(text){

const div=document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


/* ================= 공지사항 ================= */

window.addNotice = async function(){

const title=
document.getElementById("noticeTitle").value.trim();

const text=
document.getElementById("noticeText").value.trim();

if(!title || !text){

alert("제목과 내용을 입력해주세요.");

return;

}

try{

await addDoc(collection(db,"notices"),{

title:title,
text:text,
createdAt:serverTimestamp()

});

document.getElementById("noticeTitle").value="";
document.getElementById("noticeText").value="";

document.getElementById("noticeForm")
.classList.remove("show");

}catch(error){

console.error(error);

alert("공지 저장에 실패했습니다.");

}

};


/* 공지 실시간 표시 */

onSnapshot(
query(
collection(db,"notices"),
orderBy("createdAt","desc")
),
snapshot => {

const list=
document.getElementById("noticeList");

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
`<div class="empty">
아직 등록된 공지사항이 없습니다.
</div>`;

return;

}

snapshot.forEach(item=>{

const data=item.data();

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="date">공지사항</div>

<h3>${escapeHtml(data.title)}</h3>

<p>${escapeHtml(data.text)}</p>

<button class="delete"
onclick="deleteItem('notices','${item.id}')">
삭제
</button>

`;

list.appendChild(card);

});

}
);


/* ================= 건의함 ================= */

window.addSuggestion = async function(){

const text=
document.getElementById("suggestionText")
.value.trim();

if(!text){

alert("건의 내용을 입력해주세요.");

return;

}

try{

await addDoc(collection(db,"suggestions"),{

text:text,
createdAt:serverTimestamp()

});

document.getElementById("suggestionText").value="";

alert("익명으로 제출되었습니다.");

}catch(error){

console.error(error);

alert("건의사항 저장에 실패했습니다.");

}

};


/* 건의 실시간 표시 */

onSnapshot(
query(
collection(db,"suggestions"),
orderBy("createdAt","desc")
),
snapshot=>{

const list=
document.getElementById("suggestionList");

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
`<div class="empty">
아직 등록된 건의사항이 없습니다.
</div>`;

return;

}

snapshot.forEach(item=>{

const data=item.data();

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="date">익명</div>

<p>${escapeHtml(data.text)}</p>

<button class="delete"
onclick="deleteItem('suggestions','${item.id}')">
삭제
</button>

`;

list.appendChild(card);

});

}
);


/* ================= 일정 ================= */

let currentYear=2026;

let currentMonth=8;

let selectedDate=null;

let events={};


function dateKey(year,month,day){

return `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

}


function renderCalendar(){

const title=
document.getElementById("monthTitle");

const days=
document.getElementById("days");

title.textContent=
`${currentYear}년 ${currentMonth+1}월`;

days.innerHTML="";

const firstDay=
new Date(currentYear,currentMonth,1).getDay();

const lastDate=
new Date(currentYear,currentMonth+1,0).getDate();


for(let i=0;i<firstDay;i++){

const blank=document.createElement("div");

days.appendChild(blank);

}


for(let day=1;day<=lastDate;day++){

const cell=document.createElement("div");

const number=document.createElement("div");

number.className="day-number";

number.textContent=day;

cell.appendChild(number);


const key=
dateKey(currentYear,currentMonth,day);


if(events[key]){

events[key].forEach(event=>{

const eventElement=
document.createElement("div");

eventElement.className="event";

eventElement.textContent=event.title;

cell.appendChild(eventElement);

});

}


cell.onclick=()=>{

selectedDate=key;

document.getElementById("selectedDateTitle")
.textContent=
`${currentYear}년 ${currentMonth+1}월 ${day}일 일정 추가`;

document.getElementById("eventForm")
.classList.add("show");

};

days.appendChild(cell);

}

}


/* 일정 실시간 표시 */

onSnapshot(
query(
collection(db,"events"),
orderBy("date","asc")
),
snapshot=>{

events={};

const list=
document.getElementById("scheduleList");

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
`<div class="empty">
아직 등록된 일정이 없습니다.
</div>`;

renderCalendar();

return;

}


snapshot.forEach(item=>{

const data=item.data();

if(!events[data.date]){

events[data.date]=[];

}

events[data.date].push({

title:data.title,
text:data.text,
id:item.id

});


const itemBox=
document.createElement("div");

itemBox.className="schedule-item";

itemBox.innerHTML=`

<strong>📅 ${escapeHtml(data.date)}</strong>

<div>
<strong>${escapeHtml(data.title)}</strong>
</div>

<div style="color:#777;margin-top:5px">
${escapeHtml(data.text || "")}
</div>

<button class="delete"
onclick="deleteItem('events','${item.id}')">
삭제
</button>

`;

list.appendChild(itemBox);

});

renderCalendar();

}
);


/* 일정 등록 */

window.addEvent = async function(){

if(!selectedDate){

alert("날짜를 먼저 선택해주세요.");

return;

}

const title=
document.getElementById("eventTitle")
.value.trim();

const text=
document.getElementById("eventText")
.value.trim();

if(!title){

alert("일정 제목을 입력해주세요.");

return;

}

try{

await addDoc(collection(db,"events"),{

date:selectedDate,
title:title,
text:text,
createdAt:serverTimestamp()

});

document.getElementById("eventTitle").value="";

document.getElementById("eventText").value="";

document.getElementById("eventForm")
.classList.remove("show");

}catch(error){

console.error(error);

alert("일정 저장에 실패했습니다.");

}

};


/* 달 이동 */

window.changeMonth=function(direction){

currentMonth+=direction;

if(currentMonth>11){

currentMonth=0;
currentYear++;

}

if(currentMonth<0){

currentMonth=11;
currentYear--;

}


const index=currentYear*12+currentMonth;

const min=2026*12+8;

const max=2027*12+1;

if(index<min){

currentYear=2026;
currentMonth=8;

}

if(index>max){

currentYear=2027;
currentMonth=1;

}

renderCalendar();

};


/* ================= 과제 링크 ================= */

window.addAssignment=async function(){

const title=
document.getElementById("assignmentTitle")
.value.trim();

const url=
document.getElementById("assignmentUrl")
.value.trim();

if(!title || !url){

alert("과제 이름과 링크를 입력해주세요.");

return;

}

try{

await addDoc(collection(db,"assignments"),{

title:title,
url:url,
createdAt:serverTimestamp()

});

document.getElementById("assignmentTitle").value="";

document.getElementById("assignmentUrl").value="";

document.getElementById("assignmentForm")
.classList.remove("show");

}catch(error){

console.error(error);

alert("링크 저장에 실패했습니다.");

}

};


/* 과제 링크 실시간 표시 */

onSnapshot(
query(
collection(db,"assignments"),
orderBy("createdAt","desc")
),
snapshot=>{

const list=
document.getElementById("assignmentList");

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
`<div class="empty">
등록된 과제 링크가 없습니다.
</div>`;

return;

}

snapshot.forEach(item=>{

const data=item.data();

const card=
document.createElement("div");

card.className="link-card";

card.innerHTML=`

<a
href="${escapeHtml(data.url)}"
target="_blank"
rel="noopener noreferrer"
style="text-decoration:none;color:#222">

<strong>🔗 ${escapeHtml(data.title)}</strong>

<small>
링크를 눌러 과제를 제출하세요
</small>

</a>

<button class="delete"
onclick="deleteItem('assignments','${item.id}')">
삭제
</button>

`;

list.appendChild(card);

});

}
);


/* ================= 삭제 ================= */

window.deleteItem=async function(collectionName,id){

if(!confirm("정말 삭제할까요?")){

return;

}

try{

await deleteDoc(
doc(db,collectionName,id)
);

}catch(error){

console.error(error);

alert("삭제에 실패했습니다.");

}

};


renderCalendar();

</script>

</body>
</html>
