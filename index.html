<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026학년도 1-4</title>

<style>
* {
  box-sizing: border-box;
}

html {
  background: #f7f7fb;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
  background: #f7f7fb;
  color: #333;
}

button,
input,
textarea {
  font-family: inherit;
}

button {
  border: none;
  cursor: pointer;
}

/* =========================
   전체
========================= */

.container {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 34px 0 70px;
}

/* =========================
   헤더
========================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.title {
  font-size: 30px;
  font-weight: 850;
  letter-spacing: -1.5px;
}

.today-btn {
  background: white;
  border: 1px solid #e8e8ef;
  padding: 10px 16px;
  border-radius: 13px;
  font-size: 13px;
  font-weight: 700;
}

/* =========================
   검색
========================= */

.search-area {
  margin-bottom: 16px;
}

.search {
  width: 100%;
  height: 48px;
  border: 1px solid #e5e5ec;
  border-radius: 15px;
  background: white;
  padding: 0 17px;
  font-size: 14px;
  outline: none;
}

.search:focus {
  border-color: #c9c9d4;
}

/* =========================
   달력
========================= */

.month-header {
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 19px 23px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eeeeF3;
}

.month-title {
  font-size: 23px;
  font-weight: 850;
  letter-spacing: -0.8px;
}

.month-buttons {
  display: flex;
  gap: 7px;
}

.month-buttons button {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: #f5f5f8;
  font-size: 20px;
}

.month-buttons button:disabled {
  opacity: .3;
  cursor: default;
}

.calendar {
  background: white;
  border-radius: 0 0 22px 22px;
  overflow: hidden;
  box-shadow: 0 6px 28px rgba(30, 30, 50, .045);
}

/* =========================
   요일
========================= */

.weekdays,
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.weekdays {
  background: #fafafd;
  border-bottom: 1px solid #eeeeF3;
}

.weekday {
  text-align: center;
  padding: 12px 0;
  font-size: 12px;
  font-weight: 750;
  color: #888;
}

.weekday:first-child {
  color: #e97878;
}

.weekday:last-child {
  color: #7187d9;
}

/* =========================
   한 주
========================= */

.week {
  position: relative;
  min-height: 150px;
  border-bottom: 1px solid #eeeeF3;
}

.week:last-child {
  border-bottom: none;
}

/* =========================
   날짜 칸
========================= */

.day {
  position: relative;
  min-width: 0;
  border-right: 1px solid #eeeeF3;
  padding: 10px 8px 58px;
  cursor: pointer;
}

.day:last-child {
  border-right: none;
}

.day.empty {
  background: #fcfcfd;
  cursor: default;
}

.day-number {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 650;
  border-radius: 50%;
  position: relative;
  z-index: 5;
}

.day.today .day-number {
  background: #333;
  color: white;
}

.day.sunday .day-number {
  color: #e97878;
}

.day.saturday .day-number {
  color: #7187d9;
}

.day.today.sunday .day-number,
.day.today.saturday .day-number {
  color: white;
}

/* =========================
   일정 레이어
========================= */

.event-layer {
  position: absolute;
  left: 0;
  right: 0;
  top: 44px;
  bottom: 0;

  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 30px;

  pointer-events: none;
}

.event-bar {
  height: 24px;
  margin: 2px 4px;

  padding: 4px 8px;

  border-radius: 8px;

  font-size: 12px;
  font-weight: 750;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;

  cursor: pointer;
  pointer-events: auto;

  position: relative;
  z-index: 10;

  transition: transform .15s ease;
}

.event-bar:hover {
  transform: translateY(-1px);
}

.event-pink {
  background: #ffdce5;
  color: #a94f69;
}

.event-purple {
  background: #e7ddff;
  color: #7657ad;
}

.event-blue {
  background: #dcecff;
  color: #5075ad;
}

.event-green {
  background: #dff3e5;
  color: #4e8a60;
}

.event-yellow {
  background: #fff0c7;
  color: #99752d;
}

.event-peach {
  background: #ffe3d4;
  color: #a96346;
}

.event-bar.start {
  border-radius: 8px;
}

.event-bar.middle {
  border-radius: 5px;
}

.event-bar.end {
  border-radius: 8px;
}

/* =========================
   상세
========================= */

.detail-panel {
  margin-top: 20px;
  background: white;
  border-radius: 20px;
  padding: 24px;
  display: none;
  box-shadow: 0 6px 28px rgba(30,30,50,.04);
}

.detail-panel.show {
  display: block;
}

.detail-title {
  font-size: 21px;
  font-weight: 850;
  margin-bottom: 7px;
}

.detail-date {
  color: #999;
  font-size: 13px;
  margin-bottom: 17px;
}

.detail-content {
  white-space: pre-wrap;
  line-height: 1.7;
  font-size: 14px;
}

.detail-image {
  max-width: 100%;
  max-height: 450px;
  margin-top: 18px;
  border-radius: 14px;
  display: block;
}

.detail-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.edit-btn,
.delete-btn {
  padding: 10px 15px;
  border-radius: 10px;
  font-weight: 750;
}

.edit-btn {
  background: #f1f1f6;
}

.delete-btn {
  background: #ffe7e7;
  color: #c45b5b;
}

/* =========================
   모달
========================= */

.modal-bg {
  position: fixed;
  inset: 0;

  background: rgba(20,20,30,.38);

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  z-index: 1000;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;

  overflow-y: auto;

  background: white;
  border-radius: 23px;

  padding: 25px;
}

.modal-title {
  font-size: 21px;
  font-weight: 850;
  margin-bottom: 20px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 750;
  margin-bottom: 7px;
}

.field input,
.field textarea {
  width: 100%;

  border: 1px solid #e4e4eb;
  border-radius: 11px;

  padding: 11px 12px;

  font-size: 14px;

  outline: none;
}

.field input:focus,
.field textarea:focus {
  border-color: #c5c5d0;
}

.field textarea {
  min-height: 100px;
  resize: vertical;
}

.date-row,
.time-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.all-day-row {
  display: flex;
  align-items: center;
  gap: 8px;

  margin-bottom: 15px;

  font-size: 13px;
}

.all-day-row input {
  width: 17px;
  height: 17px;
}

/* =========================
   색상
========================= */

.colors {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.color-option {
  width: 34px;
  height: 34px;

  border-radius: 50%;

  border: 3px solid transparent;

  cursor: pointer;
}

.color-option.selected {
  border-color: #333;
}

.color-pink {
  background: #ffdce5;
}

.color-purple {
  background: #e7ddff;
}

.color-blue {
  background: #dcecff;
}

.color-green {
  background: #dff3e5;
}

.color-yellow {
  background: #fff0c7;
}

.color-peach {
  background: #ffe3d4;
}

/* =========================
   사진
========================= */

.preview {
  max-width: 100%;
  max-height: 200px;

  border-radius: 12px;

  margin-top: 10px;

  display: none;
}

/* =========================
   버튼
========================= */

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 22px;
}

.cancel-btn,
.save-btn {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  font-weight: 800;
}

.cancel-btn {
  background: #f2f2f5;
}

.save-btn {
  background: #333;
  color: white;
}

.save-btn:disabled {
  opacity: .55;
  cursor: wait;
}

/* =========================
   로딩
========================= */

.loading {
  padding: 50px 20px;
  text-align: center;
  color: #999;
  font-size: 13px;
}

/* =========================
   모바일
========================= */

@media (max-width: 700px) {

  .container {
    width: calc(100% - 20px);

  }

  .header {
    margin-bottom: 14px;
  }

  .title {
    font-size: 21px;
    letter-spacing: -1px;
  }

  .today-btn {
    padding: 8px 12px;

  }

  .search {
    height: 45px;

  }

  .month-header {

  }

  .month-title {

  }

  .month-buttons {

  }

  .month-buttons button {

    height: 34px;

  }

  .calendar {

  }

    모바일에서 날짜 칸을 조금 더 높게.

  }

    padding:

  }

      4px;

    border-radius: 6px;
  }

  .detail-panel {
    padding: 18px;
    border-radius: 17px;
  }

  .modal-bg {
    padding: 10px;
    align-items: flex-end;
  }

  .modal {
    max-height: 92vh;
    padding: 20px;
    border-radius: 20px 20px 16px 16px;

  .modal-title {
    font-size: 19px;
  }

  .field input,
  .field textarea {
    font-size: 14px;
  }

  .color-option {
    width: 36px;
    height: 36px;
  }
}

/* 더 작은 휴대폰 */

@media (max-width: 390px) {

  .container {
    width: calc(100% - 14px);
  }

  .title {
    font-size: 19px;
  }

  .week {
    min-height: 140px;
  }

  .day {
    min-height: 140px;
  }

  .event-bar {
    font-size: 8px;
    padding-left: 3px;
    padding-right: 3px;
  }
}
</style>
</head>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDfTikTJzhyUFxZt68--TKHUG5SDqmyu30",

  authDomain:
    "calender-5c0e2.firebaseapp.com",

  projectId:
    "calender-5c0e2",

  storageBucket:
    "calender-5c0e2.firebasestorage.app",

  messagingSenderId:
    "375015754915",

  appId:
    "1:375015754915:web:2299d1c98e3d9c9d17c316",

  measurementId:
    "G-F43H6H3NLX"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const eventsCollection =
  collection(db, "events");


/* =====================================================
   기본 설정
===================================================== */

const MIN_DATE =
  new Date(2026, 8, 1);

const MAX_DATE =
  new Date(2027, 1, 28);

let currentMonth =
  new Date(2026, 8, 1);

let events = [];

let selectedColor =
  "pink";

let editingId =
  null;

let selectedEventId =
  null;

let selectedImageData =
  "";


/* =====================================================
   DOM
===================================================== */

const calendarBody =
  document.getElementById("calendarBody");

const modalBg =
  document.getElementById("modalBg");

const modalTitle =
  document.getElementById("modalTitle");

const eventTitle =
  document.getElementById("eventTitle");

const startDate =
  document.getElementById("startDate");

const endDate =
  document.getElementById("endDate");

const allDay =
  document.getElementById("allDay");

const startTime =
  document.getElementById("startTime");

const endTime =
  document.getElementById("endTime");

const eventContent =
  document.getElementById("eventContent");

const eventImage =
  document.getElementById("eventImage");

const preview =
  document.getElementById("preview");

const timeFields =
  document.getElementById("timeFields");

const saveBtn =
  document.getElementById("saveBtn");


/* =====================================================
   날짜
===================================================== */

function dateKey(date) {

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const d =
    String(date.getDate())
      .padStart(2, "0");

  return `${y}-${m}-${d}`;
}


function parseDate(str) {

  const [y, m, d] =
    str.split("-").map(Number);

  return new Date(
    y,
    m - 1,
    d
  );
}


function formatDate(str) {

  const d =
    parseDate(str);

  return (
    `${d.getFullYear()}.` +
    `${String(d.getMonth() + 1).padStart(2, "0")}.` +
    `${String(d.getDate()).padStart(2, "0")}`
  );
}


function isSameDay(a, b) {

  return dateKey(a) === dateKey(b);

}


/* =====================================================
   FIREBASE에서 일정 불러오기
===================================================== */

async function loadEvents() {

  try {

    const snapshot =
      await getDocs(eventsCollection);

    events =
      snapshot.docs.map(item => ({

        id: item.id,

        ...item.data()

      }));

    renderCalendar();

  } catch (error) {

    console.error(error);

    calendarBody.innerHTML = `
      <div class="loading">
        일정을 불러오지 못했습니다.
      </div>
    `;

    alert(
      "Firebase에서 일정을 불러오지 못했습니다.\n\n" +
      "Firestore 보안 규칙을 확인해주세요."
    );

  }

}


/* =====================================================
   달력 이동
===================================================== */

function changeMonth(amount) {

  currentMonth =
    new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth() + amount,
      1
    );


  if (currentMonth < MIN_DATE) {

    currentMonth =
      new Date(MIN_DATE);

  }


  if (
    currentMonth.getFullYear() >
      MAX_DATE.getFullYear() ||

    (
      currentMonth.getFullYear() ===
        MAX_DATE.getFullYear() &&

      currentMonth.getMonth() >
        MAX_DATE.getMonth()
    )
  ) {

    currentMonth =
      new Date(
        MAX_DATE.getFullYear(),
        MAX_DATE.getMonth(),
        1
      );

  }


  renderCalendar();

}


/* =====================================================
   오늘
===================================================== */

function goToday() {

  const today =
    new Date();

  if (
    today >= MIN_DATE &&
    today <= MAX_DATE
  ) {

    currentMonth =
      new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      );

  }

  renderCalendar();

}


/* =====================================================
   달력
===================================================== */

function renderCalendar() {

  const year =
    currentMonth.getFullYear();

  const month =
    currentMonth.getMonth();


  document.getElementById("monthTitle")
    .textContent =
      `${year}년 ${month + 1}월`;


  calendarBody.innerHTML =
    "";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const lastDate =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const totalCells =
    Math.ceil(
      (firstDay + lastDate) / 7
    ) * 7;


  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const today =
    new Date();


  for (
    let weekStart = 0;
    weekStart < totalCells;
    weekStart += 7
  ) {

    const week =
      document.createElement("div");

    week.className =
      "week";


    /* 날짜 */

    for (
      let i = 0;
      i < 7;
      i++
    ) {

      const cellIndex =
        weekStart + i;

      const dayNumber =
        cellIndex - firstDay + 1;


      const day =
        document.createElement("div");

      day.className =
        "day";


      if (
        dayNumber < 1 ||
        dayNumber > lastDate
      ) {

        day.classList.add("empty");

        week.appendChild(day);

        continue;

      }


      const date =
        new Date(
          year,
          month,
          dayNumber
        );


      const key =
        dateKey(date);


      if (i === 0) {
        day.classList.add("sunday");
      }

      if (i === 6) {
        day.classList.add("saturday");
      }

      if (isSameDay(date, today)) {
        day.classList.add("today");
      }


      const number =
        document.createElement("div");

      number.className =
        "day-number";

      number.textContent =
        dayNumber;

      day.appendChild(number);


      day.addEventListener(
        "click",
        function(e) {

          if (
            e.target.closest(".event-bar")
          ) return;

          openModal(key);

        }
      );


      week.appendChild(day);

    }


    /* 주의 시작 / 끝 */

    const weekStartDate =
      new Date(
        year,
        month,
        1 - firstDay + weekStart
      );


    const weekEndDate =
      new Date(
        weekStartDate.getFullYear(),
        weekStartDate.getMonth(),
        weekStartDate.getDate() + 6
      );


    /* 이번 주 일정 */

    const weekEvents =
      events.filter(event => {

        const start =
          parseDate(event.start);

        const end =
          parseDate(event.end);


        const matchesSearch =
          !search ||

          (event.title || "")
            .toLowerCase()
            .includes(search) ||

          (event.content || "")
            .toLowerCase()
            .includes(search);


        return (
          start <= weekEndDate &&
          end >= weekStartDate &&
          matchesSearch
        );

      });


    /* 겹치는 일정 줄 배치 */

    const lanes = [];


    weekEvents.sort(
      (a, b) =>
        a.start.localeCompare(b.start)
    );


    weekEvents.forEach(event => {

      const eventStart =
        parseDate(event.start);

      const eventEnd =
        parseDate(event.end);


      const visibleStart =
        eventStart < weekStartDate
          ? weekStartDate
          : eventStart;


      const visibleEnd =
        eventEnd > weekEndDate
          ? weekEndDate
          : eventEnd;


      let lane = 0;


      while (true) {

        if (!lanes[lane]) {

          lanes[lane] = [];

          break;

        }


        const conflict =
          lanes[lane].some(other => {

            return !(
              visibleEnd < other.start ||
              visibleStart > other.end
            );

          });


        if (!conflict) break;

        lane++;

      }


      lanes[lane].push({

        start: visibleStart,

        end: visibleEnd

      });


      let startColumn =
        visibleStart.getDay() + 1;

      let endColumn =
        visibleEnd.getDay() + 2;


      const bar =
        document.createElement("div");


      bar.className =
        `event-bar event-${event.color || "pink"}`;


      const isRealStart =
        isSameDay(
          visibleStart,
          eventStart
        );


      const isRealEnd =
        isSameDay(
          visibleEnd,
          eventEnd
        );


      /*
        시작일에만 일정 이름
      */

      if (isRealStart) {

        bar.textContent =
          event.title;

      } else {

        bar.textContent =
          "";

      }


      if (isRealStart) {
        bar.classList.add("start");
      }

      if (isRealEnd) {
        bar.classList.add("end");
      }

      if (
        !isRealStart &&
        !isRealEnd
      ) {
        bar.classList.add("middle");
      }


      bar.style.gridColumn =
        `${startColumn} / ${endColumn}`;

      bar.style.gridRow =
        `${lane + 1}`;


      bar.addEventListener(
        "click",
        function(e) {

          e.stopPropagation();

          showDetail(event.id);

        }
      );


      let layer =
        week.querySelector(
          ".event-layer"
        );


      if (!layer) {

        layer =
          document.createElement("div");

        layer.className =
          "event-layer";

        week.appendChild(layer);

      }


      layer.appendChild(bar);

    });


    calendarBody.appendChild(week);

  }


  updateMonthButtons();

}


/* =====================================================
   월 이동 버튼
===================================================== */

function updateMonthButtons() {

  const prev =
    document.getElementById("prevBtn");

  const next =
    document.getElementById("nextBtn");


  prev.disabled =
    currentMonth.getFullYear() ===
      MIN_DATE.getFullYear() &&

    currentMonth.getMonth() ===
      MIN_DATE.getMonth();


  next.disabled =
    currentMonth.getFullYear() ===
      MAX_DATE.getFullYear() &&

    currentMonth.getMonth() ===
      MAX_DATE.getMonth();

}


/* =====================================================
   모달 열기
===================================================== */

function openModal(date) {

  editingId =
    null;

  selectedImageData =
    "";


  modalTitle.textContent =
    "일정 추가";


  eventTitle.value =
    "";

  startDate.value =
    date;

  endDate.value =
    date;

  allDay.checked =
    true;

  startTime.value =
    "";

  endTime.value =
    "";

  eventContent.value =
    "";

  eventImage.value =
    "";

  preview.src =
    "";

  preview.style.display =
    "none";


  selectColor("pink");


  toggleTime();


  modalBg.classList.add(
    "show"
  );

}


/* =====================================================
   수정
===================================================== */

function editSelected() {

  const event =
    events.find(
      item =>
        item.id ===
        selectedEventId
    );


  if (!event) return;


  editingId =
    event.id;


  modalTitle.textContent =
    "일정 수정";


  eventTitle.value =
    event.title || "";


  startDate.value =
    event.start || "";


  endDate.value =
    event.end || "";


  allDay.checked =
    event.allDay !== false;


  startTime.value =
    event.startTime || "";


  endTime.value =
    event.endTime || "";


  eventContent.value =
    event.content || "";


  selectColor(
    event.color || "pink"
  );


  selectedImageData =
    event.image || "";


  if (selectedImageData) {

    preview.src =
      selectedImageData;

    preview.style.display =
      "block";

  } else {

    preview.src =
      "";

    preview.style.display =
      "none";

  }


  eventImage.value =
    "";


  toggleTime();


  modalBg.classList.add(
    "show"
  );

}


/* =====================================================
   시간
===================================================== */

function toggleTime() {

  timeFields.style.display =
    allDay.checked
      ? "none"
      : "block";

}


/* =====================================================
   색상
===================================================== */

function selectColor(color) {

  selectedColor =
    color;


  document
    .querySelectorAll(".color-option")
    .forEach(option => {

      option.classList.toggle(
        "selected",
        option.dataset.color === color
      );

    });

}


/* =====================================================
   시간 입력
===================================================== */

function formatTimeInput(input) {

  let value =
    input.value.replace(
      /\D/g,
      ""
    );


  if (value.length > 4) {

    value =
      value.slice(0, 4);

  }


  if (value.length >= 3) {

    value =
      value.slice(0, 2) +
      ":" +
      value.slice(2);

  }


  input.value =
    value;

}


startTime.addEventListener(
  "input",
  () => formatTimeInput(startTime)
);


endTime.addEventListener(
  "input",
  () => formatTimeInput(endTime)
);


/* =====================================================
   사진
===================================================== */

eventImage.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) return;


    const reader =
      new FileReader();


    reader.onload =
      function() {

        selectedImageData =
          reader.result;


        preview.src =
          selectedImageData;


        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   이미지 압축
===================================================== */

function compressImage(dataUrl) {

  return new Promise(resolve => {

    if (!dataUrl) {

      resolve("");

      return;

    }


    const img =
      new Image();


    img.onload =
      function() {

        const maxWidth =
          900;


        let width =
          img.width;

        let height =
          img.height;


        if (width > maxWidth) {

          height =
            height *
            maxWidth /
            width;

          width =
            maxWidth;

        }


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          width;

        canvas.height =
          height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.72
          )
        );

      };


    img.src =
      dataUrl;

  });

}


/* =====================================================
   일정 저장
===================================================== */

async function saveEvent() {

  const title =
    eventTitle.value.trim();

  const start =
    startDate.value;

  const end =
    endDate.value;

  const isAllDay =
    allDay.checked;

  const content =
    eventContent.value;


  if (!title) {

    alert(
      "일정 이름을 입력해주세요."
    );

    return;

  }


  if (!start || !end) {

    alert(
      "날짜를 선택해주세요."
    );

    return;

  }


  if (
    parseDate(start) >
    parseDate(end)
  ) {

    alert(
      "종료일은 시작일보다 빠를 수 없습니다."
    );

    return;

  }


  let image =
    selectedImageData;


  if (
    image &&
    image.startsWith(
      "data:image"
    )
  ) {

    image =
      await compressImage(image);

  }


  const data = {

    title,

    start,

    end,

    allDay: isAllDay,

    startTime:
      isAllDay
        ? ""
        : startTime.value,

    endTime:
      isAllDay
        ? ""
        : endTime.value,

    color:
      selectedColor,

    content,

    image

  };


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "저장 중...";


  try {

    if (editingId) {

      await updateDoc(
        doc(
          db,
          "events",
          editingId
        ),
        data
      );


      const index =
        events.findIndex(
          item =>
            item.id ===
            editingId
        );


      if (index !== -1) {

        events[index] = {

          id: editingId,

          ...data

        };

      }


    } else {

      const created =
        await addDoc(
          eventsCollection,
          data
        );


      events.push({

        id: created.id,

        ...data

      });

    }


    closeModal();

    renderCalendar();


    if (editingId) {

      showDetail(
        editingId
      );

    }


  } catch (error) {

    console.error(error);

    alert(
      "저장에 실패했습니다.\n\n" +
      "Firebase Firestore 보안 규칙을 확인해주세요."
    );

  }


  saveBtn.disabled =
    false;

  saveBtn.textContent =
    "저장";

}


/* =====================================================
   상세 보기
===================================================== */

function showDetail(id) {

  const event =
    events.find(
      item =>
        item.id === id
    );


  if (!event) return;


  selectedEventId =
    id;


  document.getElementById(
    "detailTitle"
  ).textContent =
    event.title;


  let dateText =
    `${formatDate(event.start)} ~ ${formatDate(event.end)}`;


  if (
    event.allDay === false &&
    event.startTime
  ) {

    dateText +=
      ` · ${event.startTime} ~ ${event.endTime}`;

  }


  document.getElementById(
    "detailDate"
  ).textContent =
    dateText;


  document.getElementById(
    "detailContent"
  ).textContent =
    event.content ||
    "등록된 상세 내용이 없습니다.";


  const image =
    document.getElementById(
      "detailImage"
    );


  if (event.image) {

    image.src =
      event.image;

    image.style.display =
      "block";

  } else {

    image.src =
      "";

    image.style.display =
      "none";

  }


  const panel =
    document.getElementById(
      "detailPanel"
    );


  panel.classList.add(
    "show"
  );


  panel.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });

}


/* =====================================================
   삭제
===================================================== */

async function deleteSelected() {

  const event =
    events.find(
      item =>
        item.id ===
        selectedEventId
    );


  if (!event) return;


  const ok =
    confirm(
      `"${event.title}" 일정을 삭제할까요?`
    );


  if (!ok) return;


  try {

    await deleteDoc(
      doc(
        db,
        "events",
        selectedEventId
      )
    );


    events =
      events.filter(
        item =>
          item.id !==
          selectedEventId
      );


    selectedEventId =
      null;


    document.getElementById(
      "detailPanel"
    ).classList.remove(
      "show"
    );


    renderCalendar();


  } catch (error) {

    console.error(error);

    alert(
      "삭제에 실패했습니다."
    );

  }

}


/* =====================================================
   모달 닫기
===================================================== */

function closeModal() {

  modalBg.classList.remove(
    "show"
  );

  editingId =
    null;

  selectedImageData =
    "";

}

        );

      }
    );

  });


document.getElementById(

);


saveBtn.addEventListener(
  "click",

);


document.getElementById(
  "editBtn"
).addEventListener(
  "click",

);


document.getElementById(
  "deleteBtn"
).addEventListener(

);


/* 모달 바깥 클릭 */

modalBg.addEventListener(
  "click",
  function(e) {

    if (e.target === modalBg) {

    }

  }

    if (e.key === "Escape") {

      closeModal();

    }

  }
);


/* =====================================================
   시작
===================================================== */

renderCalendar();

loadEvents();

</script>
