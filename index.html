<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026학년도 1-4</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7fa;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
}

header {
  text-align: center;
  padding: 26px 16px 18px;
}

header h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1px;
}

header p {
  margin: 7px 0 0;
  color: #999;
  font-size: 13px;
}

.toolbar {
  max-width: 1100px;
  margin: 0 auto 16px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.toolbar-left,
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 7px;
}

.toolbar button {
  border: 0;
  background: white;
  border-radius: 11px;
  padding: 10px 14px;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

#addBtn {
  background: #333;
  color: white;
  font-weight: 700;
}

#searchInput {
  width: 170px;
  padding: 10px 13px;
  border: 0;
  outline: none;
  border-radius: 11px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  font-family: inherit;
}

/* =========================
   CALENDAR
========================= */

.calendar {
  max-width: 1100px;
  margin: auto;
  padding: 0 10px 40px;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: white;
  border-radius: 15px 15px 0 0;
  overflow: hidden;
}

.weekdays div {
  text-align: center;
  padding: 12px 0;
  font-size: 12px;
  color: #999;
  font-weight: 700;
}

.week {
  position: relative;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  min-height: 145px;
  background: white;
  border-top: 1px solid #eee;
}

.day {
  min-width: 0;
  position: relative;
  padding: 9px 5px;
  border-right: 1px solid #eee;
}

.day:last-child {
  border-right: 0;
}

.date {
  position: relative;
  z-index: 3;
  height: 25px;
  padding-left: 5px;
  font-size: 12px;
  color: #777;
}

.other-month .date {
  color: #ccc;
}

/*
  일정 영역
  날짜 숫자 아래쪽에 별도로 배치
*/
.events-layer {
  position: absolute;
  top: 38px;
  left: 0;
  width: 100%;
  z-index: 5;
  pointer-events: none;
}

.event-bar {
  position: absolute;
  height: 27px;
  padding: 5px 8px;
  border-radius: 7px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 11px;
  line-height: 17px;
  cursor: pointer;
  pointer-events: auto;
  box-sizing: border-box;
}

.event-bar.pink {
  background: #ffdce7;
}

.event-bar.purple {
  background: #e8ddff;
}

.event-bar.blue {
  background: #dcecff;
}

.event-bar.green {
  background: #daf1e2;
}

.event-bar.yellow {
  background: #fff0b8;
}

.event-bar.peach {
  background: #ffe0d0;
}

.loading,
.error {
  background: white;
  text-align: center;
  padding: 70px 20px;
  color: #999;
}

/* =========================
   MODAL
========================= */

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.4);
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: min(520px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 22px;
  padding: 23px;
}

.modal h2 {
  margin: 0 0 20px;
  font-size: 21px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 700;
  color: #666;
}

.field input,
.field textarea {
  width: 100%;
  border: 1px solid #e5e5e5;
  border-radius: 11px;
  padding: 11px;
  font-family: inherit;
  outline: none;
}

.field textarea {
  min-height: 100px;
  resize: vertical;
}

.date-row,
.time-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 15px;
  font-size: 13px;
}

.colors {
  display: flex;
  gap: 9px;
}

.color-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}

.color-btn.selected {
  border-color: #333;
}

.color-pink { background:#ffb5ca; }
.color-purple { background:#c7a7ff; }
.color-blue { background:#9dc5ff; }
.color-green { background:#9edbb4; }
.color-yellow { background:#f4d469; }
.color-peach { background:#ffb18d; }

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 12px;
  font-family: inherit;
  font-weight: 700;
}

.cancel-btn {
  background: #f1f1f1;
}

.save-btn {
  background: #333;
  color: white;
}

.delete-btn {
  background: #ffe5e5;
  color: #d44;
}

.detail-text {
  white-space: pre-wrap;
  line-height: 1.6;
  color: #555;
}

.detail-image {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {
    padding: 22px 12px 16px;
  }

  header h1 {
    font-size: 23px;
  }

  .toolbar {
    padding: 0 10px;
    flex-wrap: wrap;
  }

  .toolbar-left {
    width: 100%;
  }

  .toolbar-right {
    width: 100%;
  }

  #searchInput {
    flex: 1;
    width: auto;
    min-width: 0;
  }

  #addBtn {
    white-space: nowrap;
  }

  .calendar {
    padding: 0 6px 30px;
  }

  .weekdays div {
    padding: 10px 0;
    font-size: 11px;
  }

  .week {
    min-height: 135px;
  }

  .day {
    padding: 8px 2px;
  }

  .date {
    height: 25px;
    padding-left: 3px;
    font-size: 11px;
  }

  .events-layer {
    top: 36px;
  }

  .event-bar {
    height: 25px;
    padding: 4px 5px;
    font-size: 10px;
    line-height: 17px;
    border-radius: 6px;
  }

  .modal {
    padding: 20px;
    border-radius: 20px;
  }

}
</style>
</head>

<body>

<header>
  <h1>2026학년도 1-4</h1>
  <p id="monthTitle"></p>
</header>

<div class="toolbar">

  <div class="toolbar-left">
    <button id="prevBtn">‹</button>
    <button id="todayBtn">오늘</button>
    <button id="nextBtn">›</button>
  </div>

  <div class="toolbar-right">
    <input id="searchInput" placeholder="일정 검색">
    <button id="addBtn">+ 일정 추가</button>
  </div>

</div>

<div class="calendar">

  <div class="weekdays">
    <div>일</div>
    <div>월</div>
    <div>화</div>
    <div>수</div>
    <div>목</div>
    <div>금</div>
    <div>토</div>
  </div>

  <div id="calendarWeeks">
    <div class="loading">일정을 불러오는 중...</div>
  </div>

</div>


<!-- 일정 입력 -->

<div class="modal-bg" id="formModal">

  <div class="modal">

    <h2 id="formTitle">일정 추가</h2>

    <div class="field">
      <label>일정 제목</label>
      <input id="eventTitle" placeholder="예: 수학 시험">
    </div>

    <div class="field">
      <label>날짜</label>

      <div class="date-row">
        <input type="date" id="startDate">
        <input type="date" id="endDate">
      </div>

    </div>

    <div class="check-row">
      <input type="checkbox" id="allDay" checked>
      <label for="allDay">하루 종일</label>
    </div>

    <div id="timeArea">

      <div class="time-row">

        <div class="field">
          <label>시작</label>
          <input type="time" id="startTime" value="09:00">
        </div>

        <div class="field">
          <label>종료</label>
          <input type="time" id="endTime" value="10:00">
        </div>

      </div>

    </div>

    <div class="field">

      <label>색상</label>

      <div class="colors">

        <button class="color-btn color-pink selected" data-color="pink"></button>
        <button class="color-btn color-purple" data-color="purple"></button>
        <button class="color-btn color-blue" data-color="blue"></button>
        <button class="color-btn color-green" data-color="green"></button>
        <button class="color-btn color-yellow" data-color="yellow"></button>
        <button class="color-btn color-peach" data-color="peach"></button>

      </div>

    </div>

    <div class="field">
      <label>내용</label>
      <textarea id="eventContent" placeholder="일정 내용을 입력하세요"></textarea>
    </div>

    <div class="field">
      <label>사진</label>
      <input type="file" id="eventImage" accept="image/*">
    </div>

    <div class="modal-buttons">
      <button class="cancel-btn" id="cancelBtn">취소</button>
      <button class="save-btn" id="saveBtn">저장</button>
    </div>

  </div>

</div>


<!-- 상세 -->

<div class="modal-bg" id="detailModal">

  <div class="modal">

    <h2 id="detailTitle"></h2>

    <div id="detailDate"></div>

    <br>

    <div id="detailContent" class="detail-text"></div>

    <img id="detailImage" class="detail-image" style="display:none;">

    <div class="modal-buttons">

      <button class="cancel-btn" id="detailCloseBtn">닫기</button>
      <button class="delete-btn" id="deleteBtn">삭제</button>
      <button class="save-btn" id="editBtn">수정</button>

    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyDfTikTJzhyUFxZt68--TKHUG5SDqmyu30",

  authDomain: "calender-5c0e2.firebaseapp.com",

  projectId: "calender-5c0e2",

  storageBucket: "calender-5c0e2.firebasestorage.app",

  messagingSenderId: "375015754915",

  appId: "1:375015754915:web:2299d1c98e3d9c9d17c316",

  measurementId: "G-F43H6H3NLX"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const eventsRef = collection(db, "events");


let events = [];

let editingId = null;

let selectedEventId = null;

let currentMonth = new Date(2026, 8, 1);


/* =========================
   날짜
========================= */

function dateString(date) {

  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;

}


function parseDate(str) {

  const [y,m,d] = str.split("-").map(Number);

  return new Date(y,m-1,d);

}


function addDays(date, amount) {

  const result = new Date(date);

  result.setDate(result.getDate() + amount);

  return result;

}


function startOfWeek(date) {

  const result = new Date(date);

  result.setDate(result.getDate() - result.getDay());

  return result;

}


/* =========================
   Firebase 불러오기
========================= */

async function loadEvents() {

  try {

    const snapshot = await getDocs(eventsRef);

    events = [];

    snapshot.forEach(item => {

      events.push({
        id: item.id,
        ...item.data()
      });

    });

    renderCalendar();

  } catch(error) {

    console.error(error);

    document.getElementById("calendarWeeks").innerHTML =
      `<div class="error">
        일정을 불러오지 못했습니다.<br>
        Firestore 보안 규칙을 확인해주세요.
      </div>`;

  }

}


/* =========================
   달력
========================= */

function renderCalendar() {

  const year = currentMonth.getFullYear();

  const month = currentMonth.getMonth();

  document.getElementById("monthTitle").textContent =
    `${year}년 ${month+1}월`;


  const firstDay =
    new Date(year, month, 1);

  const lastDay =
    new Date(year, month+1, 0);


  const calendarStart =
    startOfWeek(firstDay);

  const calendarEnd =
    addDays(
      startOfWeek(lastDay),
      6
    );


  const container =
    document.getElementById("calendarWeeks");

  container.innerHTML = "";


  let weekStart =
    new Date(calendarStart);


  while (weekStart <= calendarEnd) {

    const weekEnd =
      addDays(weekStart, 6);


    const week =
      document.createElement("div");

    week.className = "week";


    /* 날짜 칸 */

    for(let i=0; i<7; i++) {

      const date =
        addDays(weekStart,i);

      const day =
        document.createElement("div");

      day.className = "day";


      if(date.getMonth() !== month) {
        day.classList.add("other-month");
      }


      const dateEl =
        document.createElement("div");

      dateEl.className = "date";

      dateEl.textContent =
        date.getDate();


      day.appendChild(dateEl);

      week.appendChild(day);

    }


    /* 일정 레이어 */

    const layer =
      document.createElement("div");

    layer.className =
      "events-layer";


    /*
      이 주에 걸쳐 있는 일정 찾기
    */

    const weekEvents =
      events.filter(event => {

        if(!event.start || !event.end)
          return false;

        return (
          event.start <= dateString(weekEnd) &&
          event.end >= dateString(weekStart)
        );

      });


    /*
      검색
    */

    const search =
      document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
      weekEvents.filter(event => {

        if(!search) return true;

        return (
          String(event.title || "")
            .toLowerCase()
            .includes(search)
          ||
          String(event.content || "")
            .toLowerCase()
            .includes(search)
        );

      });


    /*
      일정들을 줄별로 배치
    */

    const rows = [];


    filtered.forEach(event => {

      let start =
        parseDate(event.start);

      let end =
        parseDate(event.end);


      if(start < weekStart)
        start = new Date(weekStart);

      if(end > weekEnd)
        end = new Date(weekEnd);


      const startCol =
        start.getDay();

      const endCol =
        end.getDay();


      let row = 0;

      while(true) {

        if(!rows[row]) {
          rows[row] = [];
        }


        const overlap =
          rows[row].some(item => {

            return !(
              endCol < item.startCol ||
              startCol > item.endCol
            );

          });


        if(!overlap) break;

        row++;

      }


      rows[row].push({
        event,
        startCol,
        endCol
      });

    });


    /*
      일정 막대 만들기
    */

    rows.forEach((rowEvents,rowIndex) => {

      rowEvents.forEach(item => {

        const event =
          item.event;


        const bar =
          document.createElement("div");

        bar.className =
          `event-bar ${event.color || "pink"}`;


        /*
          한 주 안에서 차지할 위치
        */

        const left =
          (item.startCol / 7) * 100;

        const width =
          ((item.endCol - item.startCol + 1) / 7) * 100;


        bar.style.left =
          `calc(${left}% + 3px)`;

        bar.style.width =
          `calc(${width}% - 6px)`;


        bar.style.top =
          `${rowIndex * 31}px`;


        /*
          진짜 시작 날짜가
          이번 주 안에 있을 때만 제목 표시
        */

        const actualStart =
          parseDate(event.start);


        const visibleStart =
          addDays(
            weekStart,
            item.startCol
          );


        if(
          actualStart.getTime() ===
          visibleStart.getTime()
        ) {

          let title =
            event.title || "제목 없음";


          if(
            !event.allDay &&
            event.startTime
          ) {

            title =
              `${event.startTime} ${title}`;

          }


          bar.textContent = title;

        } else {

          /*
            이전 주부터 이어지는 일정
          */

          bar.textContent = "";

        }


        bar.addEventListener(
          "click",
          () => showDetail(event.id)
        );


        layer.appendChild(bar);

      });

    });


    week.appendChild(layer);

    /*
      일정 줄 수에 따라 주 높이 조절
    */

    const requiredHeight =
      Math.max(
        145,
        72 + rows.length * 31
      );

    week.style.minHeight =
      `${requiredHeight}px`;


    container.appendChild(week);


    weekStart =
      addDays(weekStart,7);

  }

}


/* =========================
   HTML
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   모달
========================= */

function openForm(event=null) {

  editingId =
    event ? event.id : null;


  document.getElementById("formTitle").textContent =
    event ? "일정 수정" : "일정 추가";


  document.getElementById("eventTitle").value =
    event?.title || "";


  const today =
    dateString(currentMonth);


  document.getElementById("startDate").value =
    event?.start || today;


  document.getElementById("endDate").value =
    event?.end || event?.start || today;


  document.getElementById("allDay").checked =
    event?.allDay ?? true;


  document.getElementById("startTime").value =
    event?.startTime || "09:00";


  document.getElementById("endTime").value =
    event?.endTime || "10:00";


  document.getElementById("eventContent").value =
    event?.content || "";


  document.getElementById("eventImage").value = "";


  document.querySelectorAll(".color-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "selected",
        btn.dataset.color ===
        (event?.color || "pink")
      );

    });


  updateTimeArea();


  document.getElementById("formModal")
    .classList.add("show");

}


function closeForm() {

  document.getElementById("formModal")
    .classList.remove("show");

  editingId = null;

}


function updateTimeArea() {

  document.getElementById("timeArea").style.display =
    document.getElementById("allDay").checked
      ? "none"
      : "block";

}


/* =========================
   저장
========================= */

async function saveEvent() {

  const title =
    document.getElementById("eventTitle").value.trim();

  const start =
    document.getElementById("startDate").value;

  const end =
    document.getElementById("endDate").value;


  if(!title) {

    alert("일정 제목을 입력해주세요.");

    return;

  }


  if(!start || !end) {

    alert("날짜를 입력해주세요.");

    return;

  }


  if(end < start) {

    alert("종료 날짜가 시작 날짜보다 빠를 수 없습니다.");

    return;

  }


  const allDay =
    document.getElementById("allDay").checked;


  const selectedColor =
    document.querySelector(
      ".color-btn.selected"
    )?.dataset.color || "pink";


  let image = "";


  if(editingId) {

    image =
      events.find(e => e.id === editingId)
      ?.image || "";

  }


  const imageFile =
    document.getElementById("eventImage").files[0];


  if(imageFile) {

    image =
      await fileToBase64(imageFile);

  }


  const data = {

    title: title,

    start: start,

    end: end,

    allDay: allDay,

    startTime:
      allDay
        ? ""
        : document.getElementById("startTime").value,

    endTime:
      allDay
        ? ""
        : document.getElementById("endTime").value,

    color: selectedColor,

    content:
      document.getElementById("eventContent").value.trim(),

    image: image

  };


  const saveBtn =
    document.getElementById("saveBtn");


  saveBtn.disabled = true;

  saveBtn.textContent = "저장 중...";


  try {

    if(editingId) {

      await updateDoc(
        doc(db,"events",editingId),
        data
      );

    } else {

      await addDoc(
        eventsRef,
        data
      );

    }


    await loadEvents();

    closeForm();

  } catch(error) {

    console.error(error);

    alert(
      "저장에 실패했습니다.\n\n" +
      error.message
    );

  }


  saveBtn.disabled = false;

  saveBtn.textContent = "저장";

}


/* =========================
   파일
========================= */

function fileToBase64(file) {

  return new Promise((resolve,reject) => {

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}


/* =========================
   상세
========================= */

function showDetail(id) {

  const event =
    events.find(e => e.id === id);

  if(!event) return;


  selectedEventId = id;


  document.getElementById("detailTitle")
    .textContent =
    event.title || "제목 없음";


  let dateText =
    `${event.start} ~ ${event.end}`;


  if(event.allDay) {

    dateText += " · 하루 종일";

  } else {

    dateText +=
      ` · ${event.startTime || ""} ~ ${event.endTime || ""}`;

  }


  document.getElementById("detailDate")
    .textContent = dateText;


  document.getElementById("detailContent")
    .textContent =
    event.content || "";


  const image =
    document.getElementById("detailImage");


  if(event.image) {

    image.src = event.image;

    image.style.display = "block";

  } else {

    image.style.display = "none";

  }


  document.getElementById("detailModal")
    .classList.add("show");

}


function closeDetail() {

  document.getElementById("detailModal")
    .classList.remove("show");

  selectedEventId = null;

}


/* =========================
   삭제
========================= */

async function deleteSelectedEvent() {

  if(!selectedEventId) return;


  const event =
    events.find(e => e.id === selectedEventId);


  if(!event) return;


  if(!confirm(
    `"${event.title}" 일정을 삭제할까요?`
  )) return;


  try {

    await deleteDoc(
      doc(db,"events",selectedEventId)
    );


    await loadEvents();

    closeDetail();

  } catch(error) {

    console.error(error);

    alert(
      "삭제에 실패했습니다.\n\n" +
      error.message
    );

  }

}


/* =========================
   버튼
========================= */

document
  .getElementById("addBtn")
  .addEventListener(
    "click",
    () => openForm()
  );


document
  .getElementById("cancelBtn")
  .addEventListener(
    "click",
    closeForm
  );


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    saveEvent
  );


document
  .getElementById("allDay")
  .addEventListener(
    "change",
    updateTimeArea
  );


document
  .getElementById("detailCloseBtn")
  .addEventListener(
    "click",
    closeDetail
  );


document
  .getElementById("deleteBtn")
  .addEventListener(
    "click",
    deleteSelectedEvent
  );


document
  .getElementById("editBtn")
  .addEventListener(
    "click",
    () => {

      const event =
        events.find(
          e => e.id === selectedEventId
        );

      if(!event) return;

      closeDetail();

      openForm(event);

    }
  );


document
  .getElementById("prevBtn")
  .addEventListener(
    "click",
    () => {

      currentMonth =
        new Date(
          currentMonth.getFullYear(),
          currentMonth.getMonth()-1,
          1
        );

      renderCalendar();

    }
  );


document
  .getElementById("nextBtn")
  .addEventListener(
    "click",
    () => {

      currentMonth =
        new Date(
          currentMonth.getFullYear(),
          currentMonth.getMonth()+1,
          1
        );

      renderCalendar();

    }
  );


document
  .getElementById("todayBtn")
  .addEventListener(
    "click",
    () => {

      const today =
        new Date();

      currentMonth =
        new Date(
          today.getFullYear(),
          today.getMonth(),
          1
        );

      renderCalendar();

    }
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderCalendar
  );


document
  .querySelectorAll(".color-btn")
  .forEach(btn => {

    btn.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".color-btn")
          .forEach(
            b => b.classList.remove("selected")
          );

        btn.classList.add("selected");

      }
    );

  });


/* =========================
   시작
========================= */

loadEvents();

</script>

</body>
</html>
