<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026학년도 1-4</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
  background: #f8f7fb;
  color: #333;
}

header {
  padding: 28px 20px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 800;
}

header p {
  margin: 7px 0 0;
  color: #999;
  font-size: 13px;
}

.toolbar {
  max-width: 1100px;
  margin: 0 auto 18px;
  padding: 0 16px;
  display: flex;
  gap: 8px;
  justify-content: space-between;
  align-items: center;
}

.toolbar-left,
.toolbar-right {
  display: flex;
  gap: 7px;
  align-items: center;
}

button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
}

.month-btn,
.add-btn {
  padding: 10px 15px;
  border-radius: 12px;
  background: white;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
  font-size: 14px;
}

.add-btn {
  background: #333;
  color: white;
  font-weight: 700;
}

.search {
  width: 180px;
  border: 0;
  outline: none;
  padding: 11px 14px;
  border-radius: 12px;
  background: white;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.calendar {
  max-width: 1100px;
  margin: 0 auto 40px;
  padding: 0 12px;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: white;
  border-radius: 16px 16px 0 0;
  overflow: hidden;
}

.weekdays div {
  padding: 12px 4px;
  text-align: center;
  font-size: 12px;
  color: #999;
  font-weight: 700;
}

.weeks {
  background: white;
  border-radius: 0 0 16px 16px;
  overflow: hidden;
}

.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  min-height: 145px;
  border-top: 1px solid #eee;
}

.day {
  position: relative;
  min-width: 0;
  padding: 9px 5px;
  border-right: 1px solid #eee;
}

.day:last-child {
  border-right: 0;
}

.date {
  font-size: 12px;
  color: #777;
  margin-bottom: 7px;
  padding-left: 4px;
}

.other-month .date {
  color: #ccc;
}

.event {
  position: relative;
  margin: 3px 1px;
  padding: 6px 8px;
  border-radius: 7px;
  font-size: 12px;
  line-height: 1.3;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.event.start-event {
  margin-left: 1px;
}

.event.pink { background:#ffdce7; }
.event.purple { background:#e9ddff; }
.event.blue { background:#dcecff; }
.event.green { background:#dcf4e5; }
.event.yellow { background:#fff0b8; }
.event.peach { background:#ffe1d1; }

.event-time {
  font-size: 10px;
  opacity: .65;
  margin-right: 4px;
}

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.38);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: min(520px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 22px;
  padding: 23px;
}

.modal h2 {
  margin: 0 0 20px;
  font-size: 21px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 7px;
  color: #666;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  border: 1px solid #e5e5e5;
  border-radius: 11px;
  padding: 11px;
  font-family: inherit;
  outline: none;
}

.field textarea {
  min-height: 100px;
  resize: vertical;
}

.date-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.time-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
  font-size: 13px;
}

.colors {
  display: flex;
  gap: 9px;
}

.color-btn {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  border: 2px solid transparent;
}

.color-btn.selected {
  border-color: #333;
}

.color-pink { background:#ffb6cb; }
.color-purple { background:#c8a8ff; }
.color-blue { background:#9dc6ff; }
.color-green { background:#9fddb5; }
.color-yellow { background:#f6d76c; }
.color-peach { background:#ffb18c; }

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-weight: 700;
}

.cancel-btn {
  background: #f1f1f1;
}

.save-btn {
  background: #333;
  color: white;
}

.delete-btn {
  background: #ffe5e5;
  color: #d44;
}

.detail-text {
  white-space: pre-wrap;
  line-height: 1.6;
  color: #555;
}

.detail-image {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  border-radius: 12px;
  margin-top: 15px;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.error {
  text-align: center;
  padding: 50px 20px;
  color: #d55;
}

@media (max-width: 700px) {
  header {
    padding-top: 22px;
  }

  header h1 {
    font-size: 23px;
  }

  .toolbar {
    flex-wrap: wrap;
  }

  .toolbar-left,
  .toolbar-right {
    width: 100%;
  }

  .toolbar-right {
    justify-content: space-between;
  }

  .search {
    flex: 1;
    width: auto;
  }

  .week {
    min-height: 145px;
  }

  .day {
    padding: 8px 3px;
  }

  .event {
    font-size: 11px;
    padding: 6px 5px;
  }

  .date {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header>
  <h1>2026학년도 1-4</h1>
  <p id="monthTitle">2026년 9월</p>
</header>

<div class="toolbar">
  <div class="toolbar-left">
    <button class="month-btn" id="prevBtn">‹</button>
    <button class="month-btn" id="todayBtn">오늘</button>
    <button class="month-btn" id="nextBtn">›</button>
  </div>

  <div class="toolbar-right">
    <input class="search" id="searchInput" placeholder="일정 검색">
    <button class="add-btn" id="addBtn">+ 일정 추가</button>
  </div>
</div>

<div class="calendar">
  <div class="weekdays">
    <div>일</div>
    <div>월</div>
    <div>화</div>
    <div>수</div>
    <div>목</div>
    <div>금</div>
    <div>토</div>
  </div>

  <div class="weeks" id="calendarWeeks">
    <div class="loading">일정을 불러오는 중...</div>
  </div>
</div>

<!-- 일정 추가/수정 -->
<div class="modal-bg" id="formModal">
  <div class="modal">

    <h2 id="formTitle">일정 추가</h2>

    <div class="field">
      <label>일정 제목</label>
      <input id="eventTitle" placeholder="예: 수학 시험">
    </div>

    <div class="field">
      <label>날짜</label>
      <div class="date-row">
        <input type="date" id="startDate">
        <input type="date" id="endDate">
      </div>
    </div>

    <div class="check-row">
      <input type="checkbox" id="allDay" checked>
      <label for="allDay">하루 종일</label>
    </div>

    <div id="timeArea">
      <div class="time-row">
        <div class="field">
          <label>시작 시간</label>
          <input type="time" id="startTime" value="09:00">
        </div>
        <div class="field">
          <label>종료 시간</label>
          <input type="time" id="endTime" value="10:00">
        </div>
      </div>
    </div>

    <div class="field">
      <label>색상</label>
      <div class="colors">
        <button class="color-btn color-pink selected" data-color="pink"></button>
        <button class="color-btn color-purple" data-color="purple"></button>
        <button class="color-btn color-blue" data-color="blue"></button>
        <button class="color-btn color-green" data-color="green"></button>
        <button class="color-btn color-yellow" data-color="yellow"></button>
        <button class="color-btn color-peach" data-color="peach"></button>
      </div>
    </div>

    <div class="field">
      <label>내용</label>
      <textarea id="eventContent" placeholder="일정 내용을 입력하세요"></textarea>
    </div>

    <div class="field">
      <label>사진</label>
      <input type="file" id="eventImage" accept="image/*">
    </div>

    <div class="modal-buttons">
      <button class="cancel-btn" id="cancelBtn">취소</button>
      <button class="save-btn" id="saveBtn">저장</button>
    </div>

  </div>
</div>

<!-- 일정 상세 -->
<div class="modal-bg" id="detailModal">
  <div class="modal">

    <h2 id="detailTitle"></h2>

    <div id="detailDate"></div>
    <div id="detailContent" class="detail-text"></div>
    <img id="detailImage" class="detail-image" style="display:none;">

    <div class="modal-buttons">
      <button class="cancel-btn" id="detailCloseBtn">닫기</button>
      <button class="delete-btn" id="deleteBtn">삭제</button>
      <button class="save-btn" id="editBtn">수정</button>
    </div>

  </div>
</div>


<script type="module">

/* ================================
   Firebase
================================ */

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDfTikTJzhyUFxZt68--TKHUG5SDqmyu30",
  authDomain: "calender-5c0e2.firebaseapp.com",
  projectId: "calender-5c0e2",
  storageBucket: "calender-5c0e2.firebasestorage.app",
  messagingSenderId: "375015754915",
  appId: "1:375015754915:web:2299d1c98e3d9c9d17c316",
  measurementId: "G-F43H6H3NLX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const eventsRef = collection(db, "events");


/* ================================
   변수
================================ */

let events = [];
let editingId = null;
let selectedEventId = null;

let currentMonth = new Date(2026, 8, 1);


/* ================================
   Firebase에서 일정 불러오기
================================ */

async function loadEvents() {

  try {

    const snapshot = await getDocs(eventsRef);

    events = [];

    snapshot.forEach((item) => {

      events.push({
        id: item.id,
        ...item.data()
      });

    });

    console.log("Firebase 일정 불러오기 완료:", events);

    renderCalendar();

  } catch (error) {

    console.error("Firebase 불러오기 오류:", error);

    document.getElementById("calendarWeeks").innerHTML =
      `<div class="error">
        일정을 불러오지 못했습니다.<br>
        Firestore 보안 규칙을 확인해주세요.
      </div>`;

  }

}


/* ================================
   Firebase에 새 일정 저장
================================ */

async function createEvent(data) {

  try {

    console.log("Firebase 저장 시작:", data);

    const result = await addDoc(eventsRef, data);

    console.log("Firebase 저장 성공! 문서 ID:", result.id);

    return result.id;

  } catch (error) {

    console.error("Firebase 저장 실패:", error);

    throw error;

  }

}


/* ================================
   일정 수정
================================ */

async function editEvent(id, data) {

  await updateDoc(
    doc(db, "events", id),
    data
  );

}


/* ================================
   일정 삭제
================================ */

async function removeEvent(id) {

  await deleteDoc(
    doc(db, "events", id)
  );

}


/* ================================
   날짜 함수
================================ */

function dateString(date) {

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;

}


function parseDate(str) {

  const [y, m, d] = str.split("-").map(Number);

  return new Date(y, m - 1, d);

}


function dateDiff(a, b) {

  const oneDay = 24 * 60 * 60 * 1000;

  return Math.round(
    (parseDate(b) - parseDate(a)) / oneDay
  );

}


/* ================================
   달력 그리기
================================ */

function renderCalendar() {

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  document.getElementById("monthTitle").textContent =
    `${year}년 ${month + 1}월`;

  const first = new Date(year, month, 1);

  const firstDay = first.getDay();

  const last = new Date(year, month + 1, 0);

  const daysInMonth = last.getDate();

  const previousLast =
    new Date(year, month, 0).getDate();

  const weeksContainer =
    document.getElementById("calendarWeeks");

  weeksContainer.innerHTML = "";

  let dayNumber = 1;
  let nextMonthDay = 1;

  const totalCells =
    Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for (let cell = 0; cell < totalCells; cell += 7) {

    const week = document.createElement("div");
    week.className = "week";

    for (let i = 0; i < 7; i++) {

      const index = cell + i;

      const day = document.createElement("div");
      day.className = "day";

      let actualDate;
      let otherMonth = false;

      if (index < firstDay) {

        const d = previousLast - firstDay + index + 1;

        actualDate =
          new Date(year, month - 1, d);

        otherMonth = true;

      } else if (index >= firstDay + daysInMonth) {

        actualDate =
          new Date(year, month + 1, nextMonthDay++);

        otherMonth = true;

      } else {

        actualDate =
          new Date(year, month, dayNumber++);

      }

      if (otherMonth) {
        day.classList.add("other-month");
      }

      const dateText = document.createElement("div");
      dateText.className = "date";
      dateText.textContent = actualDate.getDate();

      day.appendChild(dateText);

      const dateKey = dateString(actualDate);

      const search =
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

      const todaysEvents = events.filter(event => {

        if (
          !event.start ||
          !event.end
        ) return false;

        const inside =
          dateKey >= event.start &&
          dateKey <= event.end;

        if (!inside) return false;

        if (!search) return true;

        return (
          String(event.title || "")
            .toLowerCase()
            .includes(search) ||
          String(event.content || "")
            .toLowerCase()
            .includes(search)
        );

      });

      todaysEvents.forEach(event => {

        const eventEl =
          document.createElement("div");

        eventEl.className =
          `event ${event.color || "pink"}`;

        const isStart =
          dateKey === event.start;

        if (isStart) {

          let text = "";

          if (!event.allDay && event.startTime) {

            text +=
              `<span class="event-time">${event.startTime}</span>`;

          }

          text +=
            escapeHtml(event.title || "제목 없음");

          eventEl.innerHTML = text;

        } else {

          /*
            여러 날 일정은
            시작 날짜에만 제목 표시
          */
          eventEl.innerHTML = "&nbsp;";

        }

        eventEl.addEventListener(
          "click",
          () => showDetail(event.id)
        );

        day.appendChild(eventEl);

      });

      week.appendChild(day);

    }

    weeksContainer.appendChild(week);

  }

}


/* ================================
   HTML 문자 안전 처리
================================ */

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ================================
   모달
================================ */

const formModal =
  document.getElementById("formModal");

const detailModal =
  document.getElementById("detailModal");


function openForm(event = null) {

  editingId = event ? event.id : null;

  document.getElementById("formTitle").textContent =
    event ? "일정 수정" : "일정 추가";

  document.getElementById("eventTitle").value =
    event?.title || "";

  document.getElementById("startDate").value =
    event?.start || dateString(currentMonth);

  document.getElementById("endDate").value =
    event?.end || event?.start || dateString(currentMonth);

  document.getElementById("allDay").checked =
    event?.allDay ?? true;

  document.getElementById("startTime").value =
    event?.startTime || "09:00";

  document.getElementById("endTime").value =
    event?.endTime || "10:00";

  document.getElementById("eventContent").value =
    event?.content || "";

  document.getElementById("eventImage").value = "";

  document.querySelectorAll(".color-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "selected",
        btn.dataset.color === (event?.color || "pink")
      );

    });

  updateTimeArea();

  formModal.classList.add("show");

}


function closeForm() {

  formModal.classList.remove("show");

  editingId = null;

}


function updateTimeArea() {

  document.getElementById("timeArea").style.display =
    document.getElementById("allDay").checked
      ? "none"
      : "block";

}


/* ================================
   일정 저장
================================ */

async function saveEvent() {

  const title =
    document.getElementById("eventTitle").value.trim();

  const start =
    document.getElementById("startDate").value;

  const end =
    document.getElementById("endDate").value;

  const allDay =
    document.getElementById("allDay").checked;

  const startTime =
    document.getElementById("startTime").value;

  const endTime =
    document.getElementById("endTime").value;

  const content =
    document.getElementById("eventContent").value.trim();

  const imageFile =
    document.getElementById("eventImage").files[0];

  const selectedColor =
    document.querySelector(".color-btn.selected")
      ?.dataset.color || "pink";


  if (!title) {

    alert("일정 제목을 입력해주세요.");

    return;

  }

  if (!start || !end) {

    alert("날짜를 입력해주세요.");

    return;

  }

  if (end < start) {

    alert("종료 날짜가 시작 날짜보다 빠를 수 없습니다.");

    return;

  }


  /*
    기존 사진 유지
  */

  let image = "";

  if (editingId) {

    const oldEvent =
      events.find(e => e.id === editingId);

    image = oldEvent?.image || "";

  }


  /*
    새 사진이 있으면 base64로 저장
  */

  if (imageFile) {

    image =
      await fileToBase64(imageFile);

  }


  const data = {

    title,
    start,
    end,
    allDay,
    startTime: allDay ? "" : startTime,
    endTime: allDay ? "" : endTime,
    color: selectedColor,
    content,
    image

  };


  const saveBtn =
    document.getElementById("saveBtn");

  saveBtn.disabled = true;
  saveBtn.textContent = "저장 중...";


  try {

    /*
      ★★★ 핵심 ★★★

      수정이면 updateDoc
      새 일정이면 addDoc
    */

    if (editingId) {

      await editEvent(
        editingId,
        data
      );

    } else {

      const newId =
        await createEvent(data);

      console.log(
        "새 일정 생성 완료:",
        newId
      );

    }


    /*
      Firebase에서 다시 전체 일정 불러오기
    */

    await loadEvents();

    closeForm();

    alert("일정이 저장되었습니다.");

  } catch (error) {

    console.error(error);

    alert(
      "일정 저장에 실패했습니다.\n\n" +
      error.message
    );

  } finally {

    saveBtn.disabled = false;
    saveBtn.textContent = "저장";

  }

}


/* ================================
   파일 → Base64
================================ */

function fileToBase64(file) {

  return new Promise((resolve, reject) => {

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}


/* ================================
   상세보기
================================ */

function showDetail(id) {

  const event =
    events.find(e => e.id === id);

  if (!event) return;

  selectedEventId = id;

  document.getElementById("detailTitle").textContent =
    event.title || "제목 없음";

  let dateText =
    `${event.start} ~ ${event.end}`;

  if (event.allDay) {

    dateText += " · 하루 종일";

  } else {

    dateText +=
      ` · ${event.startTime || ""} ~ ${event.endTime || ""}`;

  }

  document.getElementById("detailDate").textContent =
    dateText;

  document.getElementById("detailContent").textContent =
    event.content || "";

  const image =
    document.getElementById("detailImage");

  if (event.image) {

    image.src = event.image;
    image.style.display = "block";

  } else {

    image.style.display = "none";

  }

  detailModal.classList.add("show");

}


function closeDetail() {

  detailModal.classList.remove("show");

  selectedEventId = null;

}


/* ================================
   삭제
================================ */

async function deleteSelectedEvent() {

  if (!selectedEventId) return;

  const event =
    events.find(e => e.id === selectedEventId);

  if (!event) return;

  if (!confirm(
    `"${event.title}" 일정을 삭제할까요?`
  )) return;


  try {

    await removeEvent(
      selectedEventId
    );

    await loadEvents();

    closeDetail();

  } catch (error) {

    console.error(error);

    alert(
      "삭제에 실패했습니다.\n\n" +
      error.message
    );

  }

}


/* ================================
   버튼 연결
================================ */

document
  .getElementById("addBtn")
  .addEventListener(
    "click",
    () => openForm()
  );


document
  .getElementById("cancelBtn")
  .addEventListener(
    "click",
    closeForm
  );


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    saveEvent
  );


document
  .getElementById("allDay")
  .addEventListener(
    "change",
    updateTimeArea
  );


document
  .getElementById("detailCloseBtn")
  .addEventListener(
    "click",
    closeDetail
  );


document
  .getElementById("deleteBtn")
  .addEventListener(
    "click",
    deleteSelectedEvent
  );


document
  .getElementById("editBtn")
  .addEventListener(
    "click",
    () => {

      const event =
        events.find(e => e.id === selectedEventId);

      if (!event) return;

      closeDetail();
      openForm(event);

    }
  );


document
  .getElementById("prevBtn")
  .addEventListener(
    "click",
    () => {

      currentMonth =
        new Date(
          currentMonth.getFullYear(),
          currentMonth.getMonth() - 1,
          1
        );

      renderCalendar();

    }
  );


document
  .getElementById("nextBtn")
  .addEventListener(
    "click",
    () => {

      currentMonth =
        new Date(
          currentMonth.getFullYear(),
          currentMonth.getMonth() + 1,
          1
        );

      renderCalendar();

    }
  );


document
  .getElementById("todayBtn")
  .addEventListener(
    "click",
    () => {

      const today = new Date();

      currentMonth =
        new Date(
          today.getFullYear(),
          today.getMonth(),
          1
        );

      renderCalendar();

    }
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderCalendar
  );


/* 색상 선택 */

document
  .querySelectorAll(".color-btn")
  .forEach(btn => {

    btn.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".color-btn")
          .forEach(b =>
            b.classList.remove("selected")
          );

        btn.classList.add("selected");

      }
    );

  });


/* ================================
   모달 바깥 클릭
================================ */

formModal.addEventListener(
  "click",
  (e) => {

    if (e.target === formModal) {
      closeForm();
    }

  }
);


detailModal.addEventListener(
  "click",
  (e) => {

    if (e.target === detailModal) {
      closeDetail();
    }

  }
);


/* ================================
   시작
================================ */

loadEvents();

</script>

</body>
</html>
