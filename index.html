<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf8fc">

<title>2026학년도 1-4</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf9fb;
    color: #35323a;
    font-family: "Noto Sans KR", sans-serif;
}

/* =========================
   전체
========================= */

.container {
    width: min(1200px, 94%);
    margin: 38px auto 60px;
}

/* =========================
   상단
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1.2px;
}

.logo span {
    color: #b8a4d5;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 9px;
}

.search-box {
    width: 210px;
    height: 42px;
    padding: 0 15px;
    border: 1px solid #e9e5ed;
    border-radius: 14px;
    background: white;
    outline: none;
    font-family: inherit;
    color: #444047;
}

.search-box:focus {
    border-color: #cdbbdf;
}

.today-btn {
    height: 42px;
    padding: 0 16px;
    border: none;
    border-radius: 14px;
    background: #eee9f4;
    color: #665a73;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.today-btn:hover {
    background: #e7e0ef;
}

/* =========================
   월 이동
========================= */

.month-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 20px;
}

.month-title {
    min-width: 175px;
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.7px;
}

.arrow {
    width: 38px;
    height: 38px;
    border: 1px solid #ebe7ee;
    border-radius: 50%;
    background: white;
    color: #77717d;
    font-size: 21px;
    cursor: pointer;
}

.arrow:hover {
    background: #f5f1f8;
}

/* =========================
   검색 결과
========================= */

.search-result {
    min-height: 20px;
    margin: 0 3px 8px;
    color: #918a96;
    font-size: 12px;
}

/* =========================
   캘린더
========================= */

.calendar {
    overflow: hidden;
    border: 1px solid #ebe7ee;
    border-radius: 22px;
    background: white;
    box-shadow: 0 8px 30px rgba(70, 60, 80, 0.045);
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid #eeeaf1;
    background: #fcfbfd;
}

.weekday {
    padding: 15px 4px;
    text-align: center;
    color: #8c8790;
    font-size: 13px;
    font-weight: 700;
}

.weekday:first-child {
    color: #cf969f;
}

.weekday:last-child {
    color: #8ca5c8;
}

.days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
}

.day {
    position: relative;
    min-width: 0;
    min-height: 132px;
    padding: 8px;
    border-right: 1px solid #f0edf2;
    border-bottom: 1px solid #f0edf2;
    background: white;
    cursor: pointer;
    transition: background 0.15s ease;
}

.day:nth-child(7n) {
    border-right: none;
}

.day:hover {
    background: #fdfbfe;
}

.empty {
    background: #fcfbfd;
    cursor: default;
}

.date-number {
    display: flex;
    width: 28px;
    height: 28px;
    align-items: center;
    justify-content: center;
    margin-bottom: 5px;
    border-radius: 50%;
    color: #57515b;
    font-size: 13px;
}

.sunday .date-number {
    color: #cf969f;
}

.saturday .date-number {
    color: #8ca5c8;
}

.today .date-number {
    background: #cbb8df;
    color: white;
    font-weight: 800;
}

/* =========================
   일정
========================= */

.event {
    width: 100%;
    min-height: 27px;
    margin: 3px 0;
    padding: 4px 8px;
    border-radius: 9px;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.35;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
}

.event:hover {
    transform: translateY(-1px);
    filter: brightness(0.98);
}

.event.search-match {
    outline: 2px solid #9c88b5;
    outline-offset: 1px;
}

.more-events {
    padding: 3px 5px;
    color: #8d8791;
    font-size: 11px;
}

/* =========================
   파스텔
========================= */

.pastel-pink {
    background: #f6d9df;
    color: #75545d;
}

.pastel-purple {
    background: #e5dbf2;
    color: #625574;
}

.pastel-blue {
    background: #d9e8f6;
    color: #526a82;
}

.pastel-green {
    background: #dceedd;
    color: #55705b;
}

.pastel-yellow {
    background: #f6edc9;
    color: #77683d;
}

.pastel-peach {
    background: #f6dfcf;
    color: #785d4c;
}

/* =========================
   상세 패널
========================= */

.detail-panel {
    display: none;
    margin-top: 24px;
    padding: 26px;
    border: 1px solid #ebe7ee;
    border-radius: 22px;
    background: white;
    box-shadow: 0 8px 30px rgba(70, 60, 80, 0.045);
}

.detail-panel.show {
    display: block;
}

.detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.detail-title {
    margin-bottom: 6px;
    overflow-wrap: anywhere;
    color: #39353d;
    font-size: 21px;
    font-weight: 800;
}

.detail-date {
    color: #918a95;
    font-size: 13px;
}

.detail-content {
    margin-top: 20px;
    padding: 17px;
    border-radius: 14px;
    background: #faf9fb;
    color: #625d65;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.detail-image {
    display: block;
    max-width: 100%;
    max-height: 420px;
    margin-top: 18px;
    border-radius: 15px;
    object-fit: contain;
}

.detail-buttons {
    display: flex;
    gap: 8px;
}

.edit-btn,
.delete-btn {
    padding: 9px 14px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.edit-btn {
    background: #eee9f4;
    color: #665a73;
}

.delete-btn {
    background: #f7e4e7;
    color: #895963;
}

/* =========================
   모달
========================= */

.modal-bg {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(45, 40, 50, 0.36);
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(500px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
    border-radius: 24px;
    background: white;
    box-shadow: 0 20px 60px rgba(40, 30, 50, 0.16);
}

.modal-title {
    margin-bottom: 22px;
    color: #39353d;
    font-size: 21px;
    font-weight: 800;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #706a74;
    font-size: 13px;
    font-weight: 700;
}

input,
textarea {
    width: 100%;
    border: 1px solid #e6e1e9;
    border-radius: 12px;
    padding: 11px 12px;
    outline: none;
    background: #fdfcfe;
    color: #454149;
    font-family: inherit;
}

input:focus,
textarea:focus {
    border-color: #cdbbdd;
    background: white;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* =========================
   시간 입력
========================= */

.time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.time-input {
    text-align: center;
    font-size: 16px;
    letter-spacing: 1px;
}

.time-input::placeholder {
    color: #aaa3ae;
    letter-spacing: 0;
}

/* 종일 */
.all-day {
    display: flex !important;
    align-items: center;
    gap: 8px;
    color: #69636d !important;
    font-weight: 500 !important;
}

.all-day input {
    width: auto;
}

/* =========================
   색상
========================= */

.color-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.color-option {
    width: 30px;
    height: 30px;
    border: 3px solid white;
    border-radius: 50%;
    box-shadow: 0 0 0 1px #d9d4dc;
    cursor: pointer;
}

.color-option.selected {
    box-shadow: 0 0 0 2px #756a7c;
}

.color-pink {
    background: #f6d9df;
}

.color-purple {
    background: #e5dbf2;
}

.color-blue {
    background: #d9e8f6;
}

.color-green {
    background: #dceedd;
}

.color-yellow {
    background: #f6edc9;
}

.color-peach {
    background: #f6dfcf;
}

/* =========================
   사진
========================= */

.photo-preview {
    display: none;
    max-width: 100%;
    max-height: 180px;
    margin-top: 10px;
    border-radius: 13px;
    object-fit: contain;
}

/* =========================
   버튼
========================= */

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
}

.cancel-btn,
.save-btn {
    padding: 11px 18px;
    border: none;
    border-radius: 13px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
}

.cancel-btn {
    background: #f0edf2;
    color: #69636d;
}

.save-btn {
    background: #cbb8df;
    color: white;
}

.save-btn:hover {
    background: #c1acd7;
}

/* =========================
   모바일
========================= */

@media (max-width: 700px) {

    .container {
        width: 96%;
        margin: 20px auto 40px;
    }

    .header {
        flex-direction: column;
        align-items: stretch;
        margin-bottom: 22px;
    }

    .logo {
        font-size: 23px;
    }

    .header-right {
        width: 100%;
    }

    .search-box {
        flex: 1;
        width: auto;
    }

    .today-btn {
        flex-shrink: 0;
    }

    .month-header {
        gap: 12px;
    }

    .month-title {
        min-width: 145px;
        font-size: 20px;
    }

    .arrow {
        width: 34px;
        height: 34px;
        font-size: 19px;
    }

    .calendar {
        border-radius: 17px;
    }

    .weekday {
        padding: 12px 2px;
        font-size: 11px;
    }

    .day {
        min-height: 108px;
        padding: 5px;
    }

    .date-number {
        width: 24px;
        height: 24px;
        margin-bottom: 4px;
        font-size: 11px;
    }

    .event {
        min-height: 23px;
        padding: 3px 5px;
        border-radius: 7px;
        font-size: 9.5px;
    }

    .more-events {
        font-size: 9px;
    }

    .detail-panel {
        padding: 20px;
        border-radius: 18px;
    }

    .detail-header {
        flex-direction: column;
    }

    .detail-title {
        font-size: 19px;
    }

    .date-row,
    .time-row {
        grid-template-columns: 1fr 1fr;
    }

    .modal {
        padding: 23px;
        border-radius: 20px;
    }
}

@media (max-width: 400px) {

    .event {
        font-size: 8.5px;
        padding: 3px 4px;
    }

    .day {
        min-height: 100px;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         상단
    ========================= -->

    <div class="header">

        <div class="logo">
            2026학년도 <span>1-4</span>
        </div>

        <div class="header-right">

            <input
                id="searchInput"
                class="search-box"
                type="search"
                placeholder="일정 검색"
                oninput="searchEvents()"
            >

            <button
                class="today-btn"
                onclick="goToday()"
            >
                오늘
            </button>

        </div>

    </div>


    <!-- =========================
         월 이동
    ========================= -->

    <div class="month-header">

        <button
            class="arrow"
            onclick="changeMonth(-1)"
        >
            ‹
        </button>

        <div
            id="monthTitle"
            class="month-title"
        ></div>

        <button
            class="arrow"
            onclick="changeMonth(1)"
        >
            ›
        </button>

    </div>


    <div
        id="searchResult"
        class="search-result"
    ></div>


    <!-- =========================
         캘린더
    ========================= -->

    <div class="calendar">

        <div class="weekdays">

            <div class="weekday">일</div>
            <div class="weekday">월</div>
            <div class="weekday">화</div>
            <div class="weekday">수</div>
            <div class="weekday">목</div>
            <div class="weekday">금</div>
            <div class="weekday">토</div>

        </div>

        <div
            id="days"
            class="days"
        ></div>

    </div>


    <!-- =========================
         일정 상세
    ========================= -->

    <div
        id="detailPanel"
        class="detail-panel"
    >

        <div class="detail-header">

            <div>

                <div
                    id="detailTitle"
                    class="detail-title"
                ></div>

                <div
                    id="detailDate"
                    class="detail-date"
                ></div>

            </div>

            <div class="detail-buttons">

                <button
                    class="edit-btn"
                    onclick="editCurrentEvent()"
                >
                    수정
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteCurrentEvent()"
                >
                    삭제
                </button>

            </div>

        </div>


        <div
            id="detailContent"
            class="detail-content"
        ></div>


        <img
            id="detailImage"
            class="detail-image"
            alt="첨부 사진"
        >

    </div>

</div>


<!-- =========================
     일정 추가 / 수정 모달
========================= -->

<div
    id="modalBg"
    class="modal-bg"
>

    <div class="modal">

        <div
            id="modalTitle"
            class="modal-title"
        >
            일정 추가
        </div>


        <!-- 일정 이름 -->

        <div class="form-group">

            <label>일정 이름</label>

            <input
                id="eventTitle"
                type="text"
                placeholder="예: 수행평가 제출"
                autocomplete="off"
            >

        </div>


        <!-- 날짜 -->

        <div class="form-group">

            <label>기간</label>

            <div class="date-row">

                <input
                    id="startDate"
                    type="date"
                >

                <input
                    id="endDate"
                    type="date"
                >

            </div>

        </div>


        <!-- 종일 -->

        <div class="form-group">

            <label class="all-day">

                <input
                    id="allDay"
                    type="checkbox"
                    checked
                    onchange="toggleTimeInputs()"
                >

                종일 일정

            </label>

        </div>


        <!-- 시간 -->

        <div
            id="timeInputs"
            class="form-group"
            style="display:none;"
        >

            <label>시간</label>

            <div class="time-row">

                <input
                    id="startTime"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="5"
                    placeholder="시작 09:00"
                    oninput="formatTime(this)"
                >

                <input
                    id="endTime"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="5"
                    placeholder="종료 12:00"
                    oninput="formatTime(this)"
                >

            </div>

        </div>


        <!-- 색상 -->

        <div class="form-group">

            <label>일정 색상</label>

            <div class="color-options">

                <div
                    class="color-option color-pink selected"
                    data-color="pastel-pink"
                    onclick="selectColor(this)"
                ></div>

                <div
                    class="color-option color-purple"
                    data-color="pastel-purple"
                    onclick="selectColor(this)"
                ></div>

                <div
                    class="color-option color-blue"
                    data-color="pastel-blue"
                    onclick="selectColor(this)"
                ></div>

                <div
                    class="color-option color-green"
                    data-color="pastel-green"
                    onclick="selectColor(this)"
                ></div>

                <div
                    class="color-option color-yellow"
                    data-color="pastel-yellow"
                    onclick="selectColor(this)"
                ></div>

                <div
                    class="color-option color-peach"
                    data-color="pastel-peach"
                    onclick="selectColor(this)"
                ></div>

            </div>

        </div>


        <!-- 상세 내용 -->

        <div class="form-group">

            <label>상세 내용</label>

            <textarea
                id="eventContent"
                placeholder="일정에 대한 내용을 입력해주세요."
            ></textarea>

        </div>


        <!-- 사진 -->

        <div class="form-group">

            <label>사진 첨부</label>

            <input
                id="eventPhoto"
                type="file"
                accept="image/*"
                onchange="previewPhoto(event)"
            >

            <img
                id="photoPreview"
                class="photo-preview"
                alt="사진 미리보기"
            >

        </div>


        <!-- 버튼 -->

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeModal()"
            >
                취소
            </button>

            <button
                class="save-btn"
                onclick="saveEvent()"
            >
                저장
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   기본 설정
========================================= */

const MIN_DATE = new Date(2026, 8, 1);
const MAX_DATE = new Date(2027, 1, 28);

let currentDate = new Date(2026, 8, 1);

let events = JSON.parse(
    localStorage.getItem("class14CalendarEvents") || "[]"
);

let selectedColor = "pastel-pink";

let editingId = null;

let selectedEventId = null;


/* =========================================
   날짜 → YYYY-MM-DD
========================================= */

function formatDate(date) {

    const year = date.getFullYear();

    const month = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        date.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =========================================
   날짜 문자열 → Date
========================================= */

function parseDate(dateString) {

    const parts = dateString.split("-");

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

}


/* =========================================
   캘린더 출력
========================================= */

function renderCalendar() {

    const year = currentDate.getFullYear();

    const month = currentDate.getMonth();

    document.getElementById("monthTitle")
        .textContent =
        `${year}년 ${month + 1}월`;


    const daysContainer =
        document.getElementById("days");

    daysContainer.innerHTML = "";


    const firstDay =
        new Date(year, month, 1).getDay();

    const lastDate =
        new Date(year, month + 1, 0).getDate();


    /* 앞쪽 빈칸 */

    for (let i = 0; i < firstDay; i++) {

        const empty =
            document.createElement("div");

        empty.className = "day empty";

        daysContainer.appendChild(empty);

    }


    /* 날짜 */

    for (
        let day = 1;
        day <= lastDate;
        day++
    ) {

        const cell =
            document.createElement("div");

        cell.className = "day";


        const date =
            new Date(year, month, day);

        const dateString =
            formatDate(date);


        /* 오늘 */

        const today =
            new Date();

        if (
            today.getFullYear() === year &&
            today.getMonth() === month &&
            today.getDate() === day
        ) {

            cell.classList.add("today");

        }


        /* 일요일 / 토요일 */

        if (date.getDay() === 0) {

            cell.classList.add("sunday");

        }

        if (date.getDay() === 6) {

            cell.classList.add("saturday");

        }


        /* 날짜 번호 */

        const number =
            document.createElement("div");

        number.className =
            "date-number";

        number.textContent =
            day;

        cell.appendChild(number);


        /* 해당 날짜 일정 */

        const dayEvents =
            events.filter(event => {

                return (
                    dateString >= event.startDate &&
                    dateString <= event.endDate
                );

            });


        const searchText =
            document.getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        /* 일정 최대 4개 */

        dayEvents
            .slice(0, 4)
            .forEach(event => {

                const eventElement =
                    document.createElement("div");

                eventElement.className =
                    `event ${event.color}`;


                if (
                    searchText &&
                    event.title
                        .toLowerCase()
                        .includes(searchText)
                ) {

                    eventElement.classList.add(
                        "search-match"
                    );

                }


                eventElement.textContent =
                    event.title;


                eventElement.onclick =
                    function(e) {

                        e.stopPropagation();

                        showEventDetail(
                            event.id
                        );

                    };


                cell.appendChild(
                    eventElement
                );

            });


        /* 일정 더보기 */

        if (dayEvents.length > 4) {

            const more =
                document.createElement("div");

            more.className =
                "more-events";

            more.textContent =
                `+ ${dayEvents.length - 4}개 더보기`;

            cell.appendChild(more);

        }


        /* 날짜 클릭 */

        cell.onclick = function() {

            openAddModal(dateString);

        };


        daysContainer.appendChild(cell);

    }

}


/* =========================================
   월 이동
========================================= */

function changeMonth(amount) {

    const newDate =
        new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + amount,
            1
        );


    if (
        newDate < MIN_DATE ||
        newDate > MAX_DATE
    ) {

        return;

    }


    currentDate = newDate;

    closeDetail();

    renderCalendar();

}


/* =========================================
   오늘
========================================= */

function goToday() {

    const today =
        new Date();


    if (today < MIN_DATE) {

        currentDate =
            new Date(2026, 8, 1);

    }

    else if (today > MAX_DATE) {

        currentDate =
            new Date(2027, 1, 1);

    }

    else {

        currentDate =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                1
            );

    }


    renderCalendar();

}


/* =========================================
   일정 추가 모달
========================================= */

function openAddModal(dateString) {

    editingId = null;


    document.getElementById("modalTitle")
        .textContent =
        "일정 추가";


    document.getElementById("eventTitle")
        .value = "";


    document.getElementById("startDate")
        .value =
        dateString;


    document.getElementById("endDate")
        .value =
        dateString;


    document.getElementById("allDay")
        .checked = true;


    document.getElementById("startTime")
        .value = "";


    document.getElementById("endTime")
        .value = "";


    document.getElementById("eventContent")
        .value = "";


    document.getElementById("eventPhoto")
        .value = "";


    document.getElementById("photoPreview")
        .style.display =
        "none";


    selectedColor =
        "pastel-pink";


    document.querySelectorAll(".color-option")
        .forEach(el => {

            el.classList.remove(
                "selected"
            );

        });


    document.querySelector(
        '[data-color="pastel-pink"]'
    ).classList.add("selected");


    toggleTimeInputs();


    document.getElementById("modalBg")
        .classList.add("show");

}


/* =========================================
   모달 닫기
========================================= */

function closeModal() {

    document.getElementById("modalBg")
        .classList.remove("show");

}


/* =========================================
   시간 입력
   숫자만 입력 → 자동으로 HH:MM
========================================= */

function formatTime(input) {

    let value =
        input.value.replace(
            /[^0-9]/g,
            ""
        );


    if (value.length > 4) {

        value =
            value.substring(0, 4);

    }


    if (value.length >= 3) {

        value =
            value.substring(0, 2)
            + ":"
            + value.substring(2);

    }


    input.value = value;

}


/* =========================================
   시간 검증
========================================= */

function isValidTime(time) {

    if (!time) return false;

    const regex =
        /^([01]\d|2[0-3]):([0-5]\d)$/;

    return regex.test(time);

}


/* =========================================
   종일 체크
========================================= */

function toggleTimeInputs() {

    const checked =
        document.getElementById("allDay")
            .checked;


    document.getElementById("timeInputs")
        .style.display =
        checked
            ? "none"
            : "block";

}


/* =========================================
   색상 선택
========================================= */

function selectColor(element) {

    document.querySelectorAll(
        ".color-option"
    ).forEach(el => {

        el.classList.remove(
            "selected"
        );

    });


    element.classList.add(
        "selected"
    );


    selectedColor =
        element.dataset.color;

}


/* =========================================
   사진 미리보기
========================================= */

function previewPhoto(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const preview =
                document.getElementById(
                    "photoPreview"
                );


            preview.src =
                e.target.result;


            preview.style.display =
                "block";

        };


    reader.readAsDataURL(file);

}


/* =========================================
   사진 압축
========================================= */

function compressImage(file) {

    return new Promise(resolve => {

        if (!file) {

            resolve(null);

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                const img =
                    new Image();


                img.onload =
                    function() {

                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        const maxWidth =
                            1000;


                        let width =
                            img.width;

                        let height =
                            img.height;


                        if (
                            width > maxWidth
                        ) {

                            height =
                                height *
                                maxWidth /
                                width;

                            width =
                                maxWidth;

                        }


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );


                        resolve(
                            canvas.toDataURL(
                                "image/jpeg",
                                0.75
                            )
                        );

                    };


                img.src =
                    e.target.result;

            };


        reader.readAsDataURL(file);

    });

}


/* =========================================
   일정 저장
========================================= */

async function saveEvent() {

    const title =
        document.getElementById(
            "eventTitle"
        ).value.trim();


    const startDate =
        document.getElementById(
            "startDate"
        ).value;


    const endDate =
        document.getElementById(
            "endDate"
        ).value;


    const content =
        document.getElementById(
            "eventContent"
        ).value.trim();


    const allDay =
        document.getElementById(
            "allDay"
        ).checked;


    const startTime =
        document.getElementById(
            "startTime"
        ).value;


    const endTime =
        document.getElementById(
            "endTime"
        ).value;


    /* 필수값 */

    if (!title) {

        alert(
            "일정 이름을 입력해주세요."
        );

        return;

    }


    if (!startDate || !endDate) {

        alert(
            "날짜를 입력해주세요."
        );

        return;

    }


    if (endDate < startDate) {

        alert(
            "종료일은 시작일보다 빠를 수 없습니다."
        );

        return;

    }


    /* 시간 */

    if (!allDay) {

        if (
            !isValidTime(startTime) ||
            !isValidTime(endTime)
        ) {

            alert(
                "시간을 09:00 형식으로 입력해주세요."
            );

            return;

        }

    }


    /* 사진 */

    const photoFile =
        document.getElementById(
            "eventPhoto"
        ).files[0];


    let photo = null;


    if (photoFile) {

        photo =
            await compressImage(
                photoFile
            );

    }


    /* 수정 */

    if (editingId) {

        const event =
            events.find(
                e =>
                    e.id ===
                    editingId
            );


        if (event) {

            event.title =
                title;

            event.startDate =
                startDate;

            event.endDate =
                endDate;

            event.content =
                content;

            event.allDay =
                allDay;

            event.startTime =
                allDay
                    ? ""
                    : startTime;

            event.endTime =
                allDay
                    ? ""
                    : endTime;

            event.color =
                selectedColor;


            if (photo) {

                event.photo =
                    photo;

            }

        }

    }

    /* 새 일정 */

    else {

        events.push({

            id:
                Date.now().toString(),

            title,

            startDate,

            endDate,

            content,

            allDay,

            startTime:
                allDay
                    ? ""
                    : startTime,

            endTime:
                allDay
                    ? ""
                    : endTime,

            color:
                selectedColor,

            photo

        });

    }


    /* 저장 */

    localStorage.setItem(
        "class14CalendarEvents",
        JSON.stringify(events)
    );


    closeModal();

    renderCalendar();

}


/* =========================================
   상세 보기
========================================= */

function showEventDetail(id) {

    const event =
        events.find(
            e =>
                e.id === id
        );


    if (!event) return;


    selectedEventId =
        id;


    document.getElementById(
        "detailTitle"
    ).textContent =
        event.title;


    let dateText =
        `${event.startDate} ~ ${event.endDate}`;


    if (
        !event.allDay &&
        event.startTime
    ) {

        dateText +=
            ` · ${event.startTime} ~ ${event.endTime}`;

    }

    else {

        dateText +=
            " · 종일";

    }


    document.getElementById(
        "detailDate"
    ).textContent =
        dateText;


    document.getElementById(
        "detailContent"
    ).textContent =
        event.content ||
        "등록된 상세 내용이 없습니다.";


    const image =
        document.getElementById(
            "detailImage"
        );


    if (event.photo) {

        image.src =
            event.photo;

        image.style.display =
            "block";

    }

    else {

        image.style.display =
            "none";

    }


    document.getElementById(
        "detailPanel"
    ).classList.add("show");


    document.getElementById(
        "detailPanel"
    ).scrollIntoView({

        behavior: "smooth",

        block: "nearest"

    });

}


/* =========================================
   상세 닫기
========================================= */

function closeDetail() {

    document.getElementById(
        "detailPanel"
    ).classList.remove(
        "show"
    );


    selectedEventId =
        null;

}


/* =========================================
   수정
========================================= */

function editCurrentEvent() {

    if (!selectedEventId) return;


    const event =
        events.find(
            e =>
                e.id ===
                selectedEventId
        );


    if (!event) return;


    editingId =
        event.id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "일정 수정";


    document.getElementById(
        "eventTitle"
    ).value =
        event.title;


    document.getElementById(
        "startDate"
    ).value =
        event.startDate;


    document.getElementById(
        "endDate"
    ).value =
        event.endDate;


    document.getElementById(
        "allDay"
    ).checked =
        event.allDay;


    document.getElementById(
        "startTime"
    ).value =
        event.startTime || "";


    document.getElementById(
        "endTime"
    ).value =
        event.endTime || "";


    document.getElementById(
        "eventContent"
    ).value =
        event.content || "";


    selectedColor =
        event.color ||
        "pastel-pink";


    document.querySelectorAll(
        ".color-option"
    ).forEach(el => {

        el.classList.toggle(

            "selected",

            el.dataset.color ===
            selectedColor

        );

    });


    const preview =
        document.getElementById(
            "photoPreview"
        );


    if (event.photo) {

        preview.src =
            event.photo;

        preview.style.display =
            "block";

    }

    else {

        preview.style.display =
            "none";

    }


    document.getElementById(
        "eventPhoto"
    ).value =
        "";


    toggleTimeInputs();


    document.getElementById(
        "modalBg"
    ).classList.add(
        "show"
    );

}


/* =========================================
   삭제
========================================= */

function deleteCurrentEvent() {

    if (!selectedEventId) return;


    const event =
        events.find(
            e =>
                e.id ===
                selectedEventId
        );


    if (!event) return;


    const confirmed =
        confirm(
            `"${event.title}" 일정을 삭제하시겠습니까?`
        );


    if (!confirmed) return;


    events =
        events.filter(
            e =>
                e.id !==
                selectedEventId
        );


    localStorage.setItem(
        "class14CalendarEvents",
        JSON.stringify(events)
    );


    closeDetail();

    renderCalendar();

}


/* =========================================
   검색
========================================= */

function searchEvents() {

    const keyword =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const result =
        document.getElementById(
            "searchResult"
        );


    if (!keyword) {

        result.textContent =
            "";

        renderCalendar();

        return;

    }


    const matched =
        events.filter(
            event =>
                event.title
                    .toLowerCase()
                    .includes(keyword) ||
                event.content
                    .toLowerCase()
                    .includes(keyword)
        );


    result.textContent =
        `${matched.length}개의 일정이 검색되었습니다.`;


    renderCalendar();

}


/* =========================================
   모달 바깥 클릭 → 닫기
========================================= */

document.getElementById(
    "modalBg"
).addEventListener(
    "click",
    function(e) {

        if (
            e.target ===
            this
        ) {

            closeModal();

        }

    }
);


/* =========================================
   ESC → 닫기
========================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape"
        ) {

            closeModal();

        }

    }
);


/* =========================================
   시작
========================================= */

renderCalendar();

toggleTimeInputs();

</script>
